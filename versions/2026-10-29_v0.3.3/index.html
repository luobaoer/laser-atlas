    <div class="formula-controls"><label class="formula-search"><span>检索符号 / 含义</span><input id="formulaSearch" type="search" placeholder="例：q、α、M²、束腰、相位失配" autocomplete="off"></label><label class="formula-filter"><span>所属设计阶段</span><select id="formulaStage"><option value="all">全部阶段</option>${stages.map(x=>`<option value="${x.index}">${String(x.index).padStart(2,'0')} · ${html(x.title)}</option>`).join('')}</select></label><label class="memory-control"><input type="checkbox" id="memoryMode"><span><strong>记忆模式</strong><small>隐藏解释，点击逐个翻开</small></span></label></div>
    <div class="formula-helper"><span class="helper-dot"></span> 示例：在 ${c.label} 公式中，<strong>L</strong> 可能指腔长、晶体长度或光纤长度。符号必须结合当前公式定义。</div>
    <details class="formula-conventions"><summary>公式里常见的通用符号与写法（π、exp、∫、下标）</summary><dl><dt>π</dt><dd>圆周率，约 3.1415927。</dd><dt>exp(x)</dt><dd>以自然常数 e 为底的指数函数 eˣ。</dd><dt>log₁₀(x)</dt><dd>以 10 为底的对数；ln(x) 则以 e 为底。</dd><dt>∫、dA</dt><dd>积分符号；dA 代表横截面中的微小面积元。</dd><dt>＊</dt><dd>用于复电场时通常代表复共轭。</dd><dt>Δ</dt><dd>希腊字母大写 Delta，表示变化量或差值，例如 Δk。</dd><dt>≈</dt><dd>约等于，常表示模型近似或忽略高阶项。</dd><dt>₀ / 下标</dt><dd>下标用于标注位置、物理对象或条件，如 w₀ 为束腰半径；必须结合具体公式解释。</dd></dl></details>
    <div id="formulaResults" data-course="${c.id}"></div>`;
    renderFormulaResults();
  }
  function openModal(title,body,foot=''){
    const overlay=document.getElementById('termOverlay');if(!overlay)return;
    lastFocus=document.activeElement;const target=document.getElementById('termBody');
    target.innerHTML=`<div class="sheet-kicker">LASER ATLAS / QUICK REFERENCE</div><h2 id="termTitle">${html(title)}</h2>${body}${foot}`;
    overlay.hidden=false;document.body.classList.add('modal-open');activeModal=overlay;
    overlay.querySelector('.term-sheet')?.focus();
  }
  function closeModal(){if(!activeModal)return;activeModal.hidden=true;document.body.classList.remove('modal-open');activeModal=null;try{lastFocus?.focus()}catch(_){}}
  function openTerm(id){const t=TERMS.find(x=>x.id===id);if(!t)return;
    const desc=`<p class="modal-lead">${html(t.short)}</p><div class="modal-label">原理说明</div><p>${html(t.detail)}</p><div class="modal-label">在设计中的作用</div><p>${html(t.application)}</p>`;
    const foot=t.principle&&PRINCIPLES.some(p=>p.id===t.principle)?`<a class="btn" href="#/principle/${t.principle}" data-action="modal-navigate">深入学习完整原理 →</a>`:'';
    openModal(t.name,desc,foot);
  }
  function openSymbol(id,key){const f=FORMULAS.find(x=>x.id===id),s=f?.symbols.find(x=>x.key===key);if(!s)return;
    const body=`<div class="modal-symbol">${html(s.label)}</div><div class="modal-label">含义与单位</div><p class="modal-lead">${html(s.meaning)}</p><p class="symbol-unit-line">单位：${html(s.unit)}</p><div class="modal-label">理解与易错点</div><p>${html(s.insight)}</p><div class="modal-label">所属公式</div><p>${html(f.title)}</p><p class="small-muted">${html(f.note)}</p>`;
    openModal(s.label,body);
  }
  // Only replace text nodes in authored lesson paragraphs. Do not alter formulas,
  // link destinations, HTML attributes, or other interactive controls.
  function enhanceTerms(root,course){if(!document.createTreeWalker||typeof NodeFilter==='undefined')return;
    const glossary=TERMS.filter(t=>t.course===course).flatMap(t=>[t.name,...t.aliases].filter(Boolean).map(alias=>({alias,t}))).sort((a,b)=>b.alias.length-a.alias.length);
    root.querySelectorAll('.lesson-section p,.lesson-section li,.principle-article p').forEach(box=>{
      let replacements=0;
      const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue||!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;const parent=node.parentElement;if(parent?.closest('a,button,code,pre,.formula,.formula-inline,.term-link,.eq-symbol'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
      const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
      nodes.forEach(node=>{if(replacements>=8)return;const v=node.nodeValue;let idx=0;const frag=document.createDocumentFragment();let hits=0;
        while(idx<v.length&&hits<4&&replacements<8){let best=null,pos=v.length;
          for(const item of glossary){let p=v.indexOf(item.alias,idx);if(p<0||p>pos)continue;const alpha=/^[A-Za-z0-9]+$/.test(item.alias);if(alpha&&((p>0&&/[A-Za-z0-9]/.test(v[p-1]))||(p+item.alias.length<v.length&&/[A-Za-z0-9]/.test(v[p+item.alias.length]))))continue;if(p<pos){pos=p;best=item;}}
          if(!best)break;
          frag.appendChild(document.createTextNode(v.slice(idx,pos)));
          const b=document.createElement('button');b.type='button';b.className='term-link';b.dataset.term=best.t.id;b.textContent=best.alias;b.title='点击查看专业名词解释';b.setAttribute('aria-label',best.alias+'：点击查看术语解释');frag.appendChild(b);
          idx=pos+best.alias.length;hits++;replacements++;
        }
        if(hits){frag.appendChild(document.createTextNode(v.slice(idx)));node.parentNode.replaceChild(frag,node);}
      });
    });
  }
  function renderNotes(){const notes=ALL.filter(l=>(appData.notes[l.id]||'').trim());page.innerHTML=`<div class="page-head"><div><div class="eyebrow">MY WORKBOOK</div><h1>学习笔记与进度备份</h1><p>你的理解、疑问和课后记录都保存在本机浏览器。公开分享的网站不会自动公开私人笔记。</p></div></div>
  <div class="btn-row" style="margin-bottom:22px"><button class="btn" data-action="export-md">↓ 导出 Markdown 笔记</button><button class="btn secondary" data-action="backup">↓ 备份学习数据 JSON</button><label class="btn secondary" style="cursor:pointer">↑ 导入学习数据<input id="backupInput" type="file" accept="application/json,.json" style="display:none"></label></div>
  <div class="stat-grid"><div class="stat-card"><strong>${totalDone()}</strong><span>已学课程</span></div><div class="stat-card"><strong>${ALL.length}</strong><span>已编写课程</span></div><div class="stat-card"><strong>${notes.length}</strong><span>有笔记的章节</span></div></div>
  <div class="section-heading"><h2>我的笔记</h2><span class="small-muted">按章节自动整理</span></div>
  ${notes.length ? notes.map(l=>`<div class="card note-card"><div class="note-card-header"><div><div class="kicker">${l.course.label}</div><h3 style="font-size:15px;margin-top:5px">${html(l.title)}</h3></div><a class="text-link" href="#/lesson/${l.id}">继续编辑 →</a></div><p>${html(appData.notes[l.id])}</p></div>`).join('') : `<div class="empty-state"><h3>还没有记录笔记</h3><p>在任意课程右侧（手机端在文章下方）输入问题或总结，系统会自动保存。</p><a class="btn secondary btn-sm" href="#/lesson/solid-04">从三镜折叠腔开始记笔记 →</a></div>`}
  <div class="card feature-card" style="min-height:0;margin-top:25px;background:#f9fcfa"><div class="kicker">DATA & PRIVACY</div><h3>关于进度保存与跨设备</h3><p>V0.2 使用 localStorage：同一浏览器一般能保存记录；换手机、无痕模式、清理浏览器数据或切换网址可能导致进度不一致。需要跨设备继续学习时，可先导出 JSON 再导入。目前尚无账号与云端自动同步。</p></div>`;}
  function renderReferences(){page.innerHTML=`<div class="page-head"><div><div class="eyebrow">SOURCES & READING</div><h1>可靠资料与延伸阅读</h1><p>这些是课程编写时参考的权威理论资料。网页内容以课程原理为主，外部链接帮助你进一步核查公式与工程边界。</p></div></div><div class="ref-grid">${REFERENCES.map(r=>`<a href="${html(r.url)}" target="_blank" rel="noopener noreferrer" class="card ref-card"><span class="ref-tag">${html(r.tag)}</span><h3>${html(r.name)} ↗</h3><p>${html(r.desc)}</p><span>查看原始资料 →</span></a>`).join('')}</div><div class="card feature-card" style="min-height:0;margin-top:20px"><div class="kicker">TEACHING & ATTRIBUTION</div><h3>可以拿来给同事讲解</h3><p>平台的课程表述和图示为本项目原创整理，引用的理论资料只提供链接，不复制论文原图。使用「授课模式」可在大屏上展示；需要发给他人，请部署网页并分享地址。</p></div>`;}
  function renderSearch(){page.innerHTML=`<div class="page-head"><div><div class="eyebrow">SEARCH KNOWLEDGE</div><h1>搜索课程与知识点</h1><p>试试「ABCD」「LBO」「首脉冲」「偏振」「V 数」「蓝光」等关键词。</p></div></div><div style="margin-bottom:21px"><input class="search-field" id="globalSearch" placeholder="输入关键词搜索课程、标题或知识内容" autofocus autocomplete="off" /></div><div id="searchResults"></div>`;document.getElementById('globalSearch').focus();updateSearch();}
  function updateSearch(){const input=document.getElementById('globalSearch'),out=document.getElementById('searchResults');if(!input||!out)return;const term=input.value.trim().toLowerCase();const matching=ALL.filter(l=> !term || [l.title,l.subtitle,l.course.label,l.goals.join(' '),l.sections.map(s=>s.title+' '+s.body.replace(/<[^>]*>/g,' ')).join(' ')].join(' ').toLowerCase().includes(term));out.innerHTML = `<p class="small-muted" style="margin-bottom:15px">找到 ${matching.length} 节相关课程${term?' · '+html(input.value):''}</p>${matching.map(l=>`<a href="#/lesson/${l.id}" class="search-result"><strong>${html(l.title)}</strong><small>${html(l.course.label)} · ${l.min} 分钟 · ${html(l.subtitle)}</small></a>`).join('')||'<div class="empty-state"><h3>没有匹配结果</h3><p>可以尝试更短的关键词，或者浏览课程目录。</p></div>'}`;}
  function download(name,type,content){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function exportMD(){let result=['# Laser Atlas 学习笔记','','导出时间：'+new Date().toLocaleString('zh-CN'),''];ALL.forEach(l=>{const s=appData.notes[l.id];if(s&&s.trim())result.push(`## ${l.course.label} / ${l.title}`,'',s.trim(),'')});download('Laser-Atlas-学习笔记.md','text/markdown;charset=utf-8',result.join('\n'));toast('已导出 Markdown 笔记');}
  function backup(){download('Laser-Atlas-学习进度备份.json','application/json;charset=utf-8',JSON.stringify({format:'Laser-Atlas-Backup',version:'0.2',exportedAt:new Date().toISOString(),data:appData},null,2));toast('已导出学习进度和笔记');}
  async function importBackup(file){if(!file)return;try{const text=await file.text(),raw=JSON.parse(text);if(raw.format!=='Laser-Atlas-Backup'||!raw.data||typeof raw.data!=='object'||!raw.data.completed||!raw.data.notes){throw new Error('格式不匹配')}const d=raw.data;if(typeof d.completed!=='object'||Array.isArray(d.completed)||typeof d.notes!=='object'||Array.isArray(d.notes))throw new Error('数据异常');appData={completed:d.completed||{},notes:d.notes||{},answers:d.answers||{},lastLesson:d.lastLesson||null};saveData();toast('已导入学习记录');renderNotes();}catch(err){toast('导入失败：'+err.message)}}
  async function share(){const path=window.location.href;if(path.startsWith('file:')){toast('本地文件暂时无法对外分享，请先部署到网站；可分享压缩包供他人打开。');return;}try{if(navigator.share){await navigator.share({title:'Laser Atlas · 激光工程学习站',url:path});return;}if(navigator.clipboard){await navigator.clipboard.writeText(path);toast('已复制本页课程链接');return;}}catch(e){if(e.name==='AbortError')return;}const temp=document.createElement('textarea');temp.value=path;document.body.appendChild(temp);temp.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}temp.remove();toast(ok?'已复制本页链接':'请复制浏览器地址栏中的链接');}
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-term]');if(t){e.preventDefault();openTerm(t.dataset.term);return;}
    const sym=e.target.closest('.formula-expression [data-sym]');if(sym){e.preventDefault();openSymbol(sym.closest('.formula-expression').dataset.formula,sym.dataset.sym);return;}
    const row=e.target.closest('[data-formula-symbol]');if(row){e.preventDefault();if(formulaMemory){row.classList.toggle('revealed');}else{openSymbol(row.dataset.formulaSymbol,row.dataset.key);}return;}
    if(e.target.closest('[data-action="term-close"]')){closeModal();return;}
    if(e.target.closest('[data-action="modal-navigate"]')){closeModal();return;}
    const act=e.target.closest('[data-action]');if(act){const a=act.getAttribute('data-action');
      if(a==='complete'&&current){appData.completed[current.id]=!appData.completed[current.id];saveData();act.textContent=appData.completed[current.id]?'✓ 已标记学完':'○ 标记本节已学完';act.className='btn '+(appData.completed[current.id]?'soft':'secondary');toast(appData.completed[current.id]?'本节已完成，继续下一课吧':'已取消完成标记');}
      if(a==='quiz'&&current){const n=+act.getAttribute('data-choice');appData.answers[current.id]=n;saveData();const box=document.getElementById('quizBox');if(box)box.innerHTML=quizHtml(current);}
      if(a==='teaching'){document.body.classList.add('is-teaching');window.scrollTo({top:0,behavior:'instant'});}
      if(a==='teaching-exit')document.body.classList.remove('is-teaching');
      if(a==='print')window.print();if(a==='share')share();if(a==='export-md')exportMD();if(a==='backup')backup();
    }
    const sc=e.target.closest('[data-section-scroll]');if(sc){e.preventDefault();const id=sc.getAttribute('data-section-scroll');document.getElementById(id==='quizBox'?'quizBox':'section-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});}
    const fg=e.target.closest('[data-fold]');if(fg)updateFold(fg.getAttribute('data-fold'));
    const routeBtn=e.target.closest('[data-route]');if(routeBtn){location.hash='#'+routeBtn.getAttribute('data-route');}
    if(e.target.closest('.sidebar a'))closeSidebar();
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='lessonNote'&&current){appData.notes[current.id]=e.target.value;saveData();const s=document.getElementById('noteStatus');if(s)s.textContent='✓ 已自动保存 · 仅本机';}
    if(['cavityL','cavityR'].includes(e.target.id))updateCavity();
    if(['fiberRadius','fiberNA','fiberWL'].includes(e.target.id))updateFiber();
    if(['qFrequency','qDuty'].includes(e.target.id))updateQ();
    if(['pulsePower','pulseFreq'].includes(e.target.id))updatePulse();
    if(e.target.id==='globalSearch')updateSearch();
    if(e.target.id==='formulaSearch'){formulaQuery=e.target.value.trim();renderFormulaResults();}
  });
  document.addEventListener('change',e=>{if(e.target.id==='backupInput')importBackup(e.target.files[0]);if(e.target.id==='formulaStage'){formulaStage=e.target.value;renderFormulaResults();}if(e.target.id==='memoryMode'){formulaMemory=e.target.checked;renderFormulaResults();}});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();closeSidebar();if(document.body.classList.contains('is-teaching'))resetTeaching();}
    if(e.key==='Tab'&&activeModal){const nodes=[...activeModal.querySelectorAll('a[href],button:not([disabled]),[tabindex="0"]')].filter(el=>el.getBoundingClientRect().width>0);if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===activeModal.querySelector('.term-sheet'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.formula-expression [data-sym]')){e.preventDefault();openSymbol(e.target.closest('.formula-expression').dataset.formula,e.target.dataset.sym);}
    if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();location.hash='#/search';setTimeout(()=>document.getElementById('globalSearch')?.focus(),30);}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-fold]')){e.preventDefault();updateFold(e.target.getAttribute('data-fold'));}
  });
  document.getElementById('mobileMenu').addEventListener('click',()=>{sidebar.classList.toggle('is-open');backdrop.classList.toggle('is-open')});
  backdrop.addEventListener('click',closeSidebar);
  document.getElementById('shareBtn').addEventListener('click',share);
  window.addEventListener('hashchange',route);
  renderSideCourses();
  route();
})();

</script>
