.formula-card{background:#fff;border:1px solid #e1ebe3;border-radius:15px;padding:24px 27px;margin-bottom:15px}.formula-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#358566;font-size:10px;font-weight:800}.formula-index{color:#a2b3a8;font-size:9px;font-weight:700;letter-spacing:1px}.formula-card h3{font-size:17px;color:#224736;margin:7px 0 12px}.formula-expression{background:#f4f9f5;white-space:nowrap;overflow-x:auto;padding:18px 16px;border-radius:11px;font-size:20px;color:#1f4b3c;font-family:Georgia,'Times New Roman',serif;line-height:2.1;scrollbar-width:thin}.eq-symbol{display:inline-block;border-radius:6px;border-bottom:2px dotted #2eaa7d;cursor:pointer;padding:0 2px;margin:0 1px;color:#136d4a;transition:background .15s}.eq-symbol:hover,.eq-symbol:focus-visible{background:#d7eedf;outline:2px solid #a1d8bb;outline-offset:2px}.eq-symbol sub{font-size:.6em}.formula-label{font-size:11px;color:#8b9e91;font-weight:750;margin:18px 0 10px}.formula-symbols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.symbol-definition{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 11px;text-align:left;align-items:start;padding:11px 12px;border:1px solid #e5eee7;background:#fcfefd;border-radius:9px;cursor:pointer;transition:border-color .15s}.symbol-definition:hover{border-color:#9bceb1}.symbol-name{font-family:Georgia,'Times New Roman',serif;font-size:15px;font-weight:800;color:#217b58;grid-row:span 2;min-width:36px}.symbol-meaning{font-size:11px;color:#3f6050;line-height:1.5}.symbol-unit{font-size:10px;color:#90a297}.formula-assumption{border-top:1px solid #e8eee8;margin-top:15px;padding-top:12px;color:#687e70;font-size:11px;line-height:1.7}.formula-assumption strong{color:#3b7658}.formula-example{background:#f0f7f2;padding:10px 12px;border-radius:8px;font-size:11px;color:#357357;margin:10px 0 0}.memory-mode .symbol-definition .symbol-meaning,.memory-mode .symbol-definition .symbol-unit{filter:blur(6px);opacity:.45}.memory-mode .symbol-definition.revealed .symbol-meaning,.memory-mode .symbol-definition.revealed .symbol-unit{filter:none;opacity:1}.memory-mode .symbol-definition{border-style:dashed}

  <script>
window.LASER_COURSES = [
  {
    id:'solid', label:'固体激光', english:'SOLID-STATE LASERS', icon:'◈', accent:'#d67c47', pale:'#fff2e8', stage:'系统课程',
    summary:'从增益晶体和泵浦出发，建立谐振腔，理解声光调 Q 与 355 nm 腔内三倍频。',
    outcomes:['读懂经典固体激光腔型','能独立估算腔模与脉冲能量','理解腔内 SHG / SFG 的设计顺序'],
    lessons:[
      {id:'solid-01', title:'如何从需求开始设计激光器', subtitle:'先定指标，再决定结构', min:9, level:'基础', icon:'01',
        goals:['区分输出指标和设计变量','理解正向仿真与逆向设计','建立 355 nm 设计任务的检查表'],
        sections:[
          {title:'先把「要什么」和「用什么」分开',body:'<p>设计从目标开始，而不是从晶体型号开始。<strong>输出波长、平均功率、重复频率、脉宽、M²、温度稳定性</strong>是目标；Nd:YVO₄ 的长度、腔镜曲率、AOM 型号、LBO 的切割角则是待选择的设计变量。</p><p>当目标互相制约时，工程师要先判断物理可行性，然后比较腔型与成本，而不是直接寻找一个「标准答案」。</p>'},
          {title:'一条完整的 355 nm 能量链',body:'<div class="flowchips"><span>LD 泵浦</span><b>→</b><span>Nd:YVO₄：1064 nm</span><b>→</b><span>SHG：532 nm</span><b>→</b><span>SFG：355 nm</span></div><p>对 355 nm 紫外激光，常见做法是利用二阶非线性晶体：先把部分 1064 nm 倍频成 532 nm，再让 1064 nm 与 532 nm 和频。腔内方案的特殊之处是：<strong>非线性能量提取会反过来影响基频谐振腔</strong>。</p>'},
          {title:'第一张真实需求卡',body:'<p>我们选用一组工业设计指标贯穿学习：<strong>355±3 nm、50 kHz 下 10.5–12.5 W、脉宽 &lt;18 ns、单脉冲能量 &gt;200 μJ、扩束前 M²&lt;1.2</strong>。低漏光、首脉冲、环境稳定性属于后续必须验证的工程约束。</p><p>例：50 kHz、11.5 W 时，单脉冲能量 <span class="formula-inline">E = P / f = 230 μJ</span>。这只是由输出指标得到的能量，并不能直接反推出所需 LD 功率。</p>'}
        ], misconception:'功率达标不代表腔型优秀；热漂移、损伤裕量、批量装调和实际器件可采购性同样重要。',
        quiz:{q:'设计一台 355 nm 激光器时，哪项首先属于“设计目标”，而不是“选型结果”？',options:['腔镜曲率半径 200 mm','LBO 晶体长度 10 mm','50 kHz 下紫外功率 ≥10.5 W','Nd:YVO₄ 掺杂浓度 0.3%'],a:2,why:'输出性能先定义；镜片、晶体和结构参数应由建模、优化与器件可用性共同决定。'}},
      {id:'solid-02', title:'泵浦、增益晶体与热透镜', subtitle:'为什么不是泵浦越强越好', min:12, level:'基础', icon:'02',
        goals:['建立 808 nm / 880 nm 泵浦选择思路','理解泵浦光斑与腔模重叠','认识热透镜如何改变原本稳定的腔'],
        sections:[
          {title:'从 LD 到增益',body:'<p>对于端面泵浦 Nd:YVO₄，泵浦光必须在晶体内被有效吸收，同时要与 1064 nm 激光模式有合适的空间重叠。泵浦光斑过小可能增加晶体热梯度，过大可能使未被腔模利用的泵浦增多。</p><div class="formula">P<sub>abs</sub> ≈ P<sub>in</sub> [1 − exp(−αL)]</div><p>这是忽略反射、饱和及空间分布效应的简单吸收示意。真实设计还要考虑掺杂、泵浦波长吸收谱和温度。</p>'},
          {title:'808 与 880 nm 怎么比较',body:'<p>808 nm 泵浦的成熟度较高；880 nm 直接泵浦到较高能级能够降低量子亏损相关热负荷，但也可能带来吸收不足或器件选择上的权衡。<strong>不应只凭泵浦波长决定更优方案</strong>，应联合比较吸收长度、实际 LD 规格和热边界条件。</p>'},
          {title:'热透镜到底改了什么',body:'<p>高斯泵浦常导致非均匀温度场；温度相关的折射率、热应力和端面形变共同改变波前。初步设计常用等效薄透镜表示：</p><div class="formula">M<sub>thermal</sub> = [[1, 0], [−1 / f<sub>th</sub>, 1]]</div><p>在腔模计算中，<strong>热透镜与腔长、腔镜曲率需要一起扫描</strong>。光斑与稳定区随着泵浦工况变化，是工业设计需要关注的内容。</p>'}
        ],misconception:'“冷腔稳定”不代表正常泵浦时稳定；热透镜应作为可变参数而不是永远固定的镜片。',
        quiz:{q:'为什么选择 Nd:YVO₄ 泵浦光斑时不能无限缩小直径？',options:['因为光束小一定不能起振','会增大局部热负荷，并影响模式匹配与可靠性','因为光学波长会变长','因为 Q 开关不再需要 RF'],a:1,why:'小光斑可能提高泵浦功率密度，同时增加热梯度和损伤风险，必须做综合优化。'}},
      {id:'solid-03',title:'高斯光束、ABCD 与腔长',subtitle:'第一次亲手算出稳定区和镜面光斑',min:16,level:'核心',icon:'03',interactive:'cavity',
        goals:['掌握 g 参数与稳定性条件','计算平凹腔束腰和两端镜面光斑','理解为什么腔长不是越短越好'],
        sections:[
          {title:'从最经典的平凹腔开始',body:'<p>把一面平面镜与一面凹面镜放在空气中，设腔长 <em>L</em>、凹面镜曲率半径 <em>R</em>、波长 λ=1064 nm。理想近轴条件下：</p><div class="formula">g₁ = 1，g₂ = 1 − L/R；稳定需 0 &lt; g₁g₂ &lt; 1</div><p>当 0&lt;L&lt;R 时，平凹腔位于稳定区内部。等号对应临界边界，通常不作为鲁棒设计目标。</p>'},
          {title:'为什么能算出束腰',body:'<p>理想平凹腔的束腰位于平面镜上。先计算瑞利长度，再求束腰和凹面镜处的光斑：</p><div class="formula">z<sub>R</sub> = √[L(R−L)]<br>w₀ = √(λz<sub>R</sub>/π)<br>w(L) = w₀√[1+(L/z<sub>R</sub>)²]</div><p>如果 L=120 mm、R=300 mm，则束腰半径约 <strong>223 μm</strong>，凹面镜光斑半径约 <strong>288 μm</strong>。这些是理想空腔的 1/e² 强度半径。</p>'},
          {title:'从两镜扩展到折叠腔',body:'<p>实际腔内还有晶体、AOM 和折叠镜。每段传播都可以表示为 ABCD 矩阵，组成一整圈往返矩阵 <span class="formula-inline">[[A,B],[C,D]]</span>。</p><div class="formula">q = <span class="math-frac"><span>Aq+B</span><span>Cq+D</span></span></div><p>解出自洽复光束参数 q，再沿真实光路传播，才能得到每块晶体和腔镜位置的光斑。<strong>下一课就把这一思路用于三镜腔。</strong></p>'}
        ],misconception:'这里的 L 是理想空气腔长；含有折射晶体和斜入射曲面镜时，不能直接把几何距离代入这个两镜公式。',
        quiz:{q:'对于 λ=1064 nm、R=300 mm 的理想平凹腔，哪一项一定处于稳定区内部？',options:['L=450 mm','L=300 mm','L=120 mm','L=0 mm'],a:2,why:'平凹腔的 g₁g₂=1−L/R；L=120 mm 时为 0.6，在 0 与 1 之间。'}},
      {id:'solid-04',title:'读懂 355 nm 三镜折叠腔',subtitle:'逐个点击 M1、Nd:YVO₄、AOM、M2、LBO、M3',min:18,level:'核心',icon:'04',interactive:'fold',
        goals:['把真实光路分成两段 1064 nm 腔臂','理解 M2 的折叠、聚焦和分光职责','知道各段距离的设计依据'],
        sections:[
          {title:'先确认谁是真正的腔镜',body:'<p>以经典的<strong>三镜折叠式腔内三倍频</strong>光路作为教学案例：M1 与 M3 是两端镜，M2 负责转折；Nd:YVO₄ 和 AOM 在前一腔臂，SHG/THG 晶体在后一腔臂。1064 nm 在整个折叠路径内往返。</p><p>点击下方光路中的元件，查看它的功能、位置选择理由和需要计算的量。为了突出概念，图中的光线没有按真实角度绘制。</p>'},
          {title:'六段距离不是任意填的',body:'<div class="step-list"><div><b>d₁ · M1 → 增益晶体</b><small>先检查泵浦光斑与腔模重叠，同时考虑热透镜位置。</small></div><div><b>d₂ · 增益晶体 → AOM</b><small>满足孔径、损耗和响应要求；AOM 的光斑影响声学渡越时间。</small></div><div><b>d₃ · AOM → M2</b><small>与其余腔段共同决定往返矩阵和腔内模式。</small></div><div><b>d₄、d₅、d₆ · M2 → THG → SHG → M3</b><small>调节两块 LBO 处的 1064/532 nm 光斑及重叠，兼顾转换和损伤裕量。</small></div></div>'},
          {title:'如何决定 M2 的曲率和入射角',body:'<p>如果 M2 是曲面折叠镜，它的曲率影响后臂的聚焦；斜入射会造成切向/弧矢像散。对球面镜，可用 <span class="formula-inline">R<sub>t</sub>=R·cosθ，R<sub>s</sub>=R/cosθ</span> 进行初步近轴分析（θ 为入射角）。</p><p>真正选型时必须同时核实 M2 在 <strong>1064 / 532 / 355 nm</strong> 的反射与透射，以及 M3 对返回波长的处理。不同论文中的“THG、SHG”排列方式可能不同，不能照图直接假设绿光路径。</p>'}
        ],misconception:'不要仅因 SHG/THG 靠近 M3 就认为“越近越好”；其目标是晶体处适当光强、相位匹配及稳定的横向重叠。',
        quiz:{q:'在三镜折叠腔中，为什么改变 M2 的曲率可能同时影响 1064 nm 模式和 LBO 转换效率？',options:['只会改变外部紫外指示光颜色','改变腔内聚焦和晶体处光斑，从而影响非线性光强','只有 M1 的曲率影响腔模','改变镜面曲率会直接改变 Nd:YVO₄ 化学成分'],a:1,why:'M2 是腔内元件；其聚焦影响往返矩阵、各位置腔模和频率转换晶体内的功率密度。'}},
      {id:'solid-05',title:'AOM 调 Q、漏光与 FPS',subtitle:'把 RF 控制波形和实际脉冲区分开',min:14,level:'核心',icon:'05',interactive:'qgate',
        goals:['明确 RF 连续 ON 与 PWM 释放的区别','理解储能导致的首脉冲偏高','知道 FPS 为什么需要评价多个过渡脉冲'],
        sections:[
          {title:'RF 打开为什么反而不出光',body:'<p>很多声光调 Q 腔内使用零级光振荡。<strong>RF 连续加载</strong>时，AOM 把部分零级光衍射出谐振腔，使腔损耗高，激光可能无法达到阈值。<strong>RF 关闭的释放窗口</strong>让损耗降低，储能得以形成强脉冲。</p><p>这只是常见配置；具体调制逻辑必须根据真实 AOM 光路和 RF 驱动定义确认。</p>'},
          {title:'占空比和释放时间',body:'<p>例如 50 kHz 周期为 20 μs。如果 RF 高损耗占空比为 95%，则低损耗释放时间为 1 μs：</p><div class="formula">T = 1/f；t<sub>release</sub> = T(1−D<sub>RF</sub>)</div><p>注意<strong>1 μs 是释放窗口，不是 1 μs 的光学脉宽</strong>。实际激光脉宽可能是十几纳秒，还取决于储能、腔损耗、往返时间和非线性提取。</p>'},
          {title:'首脉冲为什么容易超高',body:'<p>当泵浦持续开启、RF 持续抑制振荡时，反转粒子数可能积累。恢复调 Q 后首个脉冲可能明显高于稳态。<strong>FPS</strong> 是通过调节早期释放的有效损耗或 RF 时序，避免过大首脉冲。</p><p>不能只看第一个峰值：若抑制过强，多余储能可能推迟到第二或第三个脉冲才释放。因此需要同时观察峰值、单脉冲能量、恢复时间和后续过冲。</p>'},
          {title:'你的关光验收应该如何定义',body:'<p>一个明确的工况例子是：<strong>泵浦 ON / DIO ON / RF 连续 ON / 没有 PWM 释放</strong>。这时要测 355 nm 的实际漏光，并验证目标材料在规定驻留条件下是否出现加工痕迹。</p><p>“连续 RF 高损耗”不等同于安全级关断；系统安全设计仍应有独立的措施。</p>'}
        ],misconception:'RF 占空比、释放窗口、光学脉宽是三个不同量；不能混为一谈。',
        quiz:{q:'在常见零级光振荡的 AOM 调 Q 腔中，泵浦保持 ON、RF 连续 ON 通常表示什么？',options:['一直处于低损耗并连续输出大功率','保持高损耗，抑制激光振荡','停止所有热效应','每 20 μs 自动释放一次'],a:1,why:'连续 RF 产生衍射损耗，通常用于抑制振荡；实际剩余漏光仍需测量。'}},
      {id:'solid-06',title:'LBO 二倍频与 355 nm 和频',subtitle:'为什么需要两块非线性晶体',min:13,level:'核心',icon:'06',
        goals:['区分 SHG 与 SFG 的物理过程','知道 LBO 长度、温度与光斑的设计权衡','理解三波转换会反馈影响 1064 nm 腔'],
        sections:[
          {title:'两步得到 355 nm',body:'<div class="formula">1064 + 1064 → 532 nm（SHG）<br>1064 + 532 → 354.7 nm（SFG）</div><p>第二步通常称为三倍频，但在常见固体紫外激光器中，真正执行的是<strong>级联二阶非线性过程</strong>，并不是简单把同一个晶体当作直接 χ⁽³⁾ 变换器。</p>'},
          {title:'为什么不是晶体越长越好',body:'<p>晶体长度更长通常增加有效相互作用距离，但也可能增加空间走离、相位失配累积、温度敏感性和损耗。最佳长度必须与晶体类型、切割方向、实际光斑和脉冲峰值功率共同确定。</p><p>相位匹配是关键条件：<span class="formula-inline">Δk = k₃ − k₂ − k₁ ≈ 0</span>。切割角或温度变化会使 Δk 偏离零，降低转换效率。</p>'},
          {title:'腔内方案的特殊性',body:'<p>在腔外频率转换中，可以先设计独立的基频激光器。腔内频率转换则消耗腔内 1064 nm 光子，改变增益饱和和脉冲演化。此时不能简单地用固定常数 <span class="formula-inline">P₃₅₅=ηP₁₀₆₄</span> 来解释所有工作点。</p><p>下一步做工程建模时，至少应先计算稳定腔模、Q 开关脉冲和两块 LBO 的耦合转换，再求解反馈。</p>'}
        ],misconception:'355 nm 并非由 532 nm “再倍频”得到；532 nm 与 1064 nm 发生和频才得到约 355 nm。',
        quiz:{q:'常见 1064 nm 固体激光器的 355 nm 产生过程正确的是？',options:['1064 → 532；532 → 266','1064 → 532；1064+532 → 355','1064 → 355 单纯折射','1064 + 1064 → 355'],a:1,why:'通常先 SHG，再由剩余 1064 nm 和生成的 532 nm 执行 SFG。'}},
      {id:'solid-07',title:'设计挑战：从指标反推器件',subtitle:'把知识组合成一份工程设计任务书',min:18,level:'实践',icon:'07',interactive:'pulse',
        goals:['将验收指标拆解成可计算的约束','给出结构初选和待测参数清单','识别模型目前不能可靠预测的指标'],
        sections:[
          {title:'需求 → 设计变量 → 验证方法',body:'<p>目标示例：<strong>355±3 nm；50 kHz、1 μs 释放窗口下 10.5–12.5 W；脉宽 &lt;18 ns；单脉冲能量 &gt;200 μJ；扩束前 M²&lt;1.2</strong>。</p><p>首先反推单脉冲能量，再估算可行的基频能量预算；选择 Nd:YVO₄ / Nd:YAG 候选、腔型、Q 开关与 LBO；最后进行泵浦热透镜和公差扫描。</p>'},
          {title:'先学会诚实标注不确定性',body:'<p>单脉冲能量 <span class="formula-inline">E=P/f</span> 可以直接算；但把 12 W 紫外输出反推成“需要 20 W 泵浦”需要额外假定吸收、转换及其他损耗，不能编造一个效率就当成器件选型依据。</p><p>还要把短期千脉冲稳定性、8 h 漂移、低漏光、FPS 过渡和温度稳定性分别建立实测验证计划。</p>'},
          {title:'完整的初步设计交付物',body:'<div class="step-list"><div><b>01 · 系统规格表</b><small>标明约束、工况、单位和测试判据。</small></div><div><b>02 · 光学布局与 ABCD 计算</b><small>提供每个器件的位置、腔模和热焦距扫描。</small></div><div><b>03 · 器件候选库</b><small>注明真实可购型号、波长/镀膜、孔径、温控和供应商依据。</small></div><div><b>04 · 风险及实验计划</b><small>列出尚未验证的转换效率、损伤裕量及长期稳定性。</small></div></div>'}
        ],misconception:'仿真曲线漂亮不能证明能量转换效率、损伤阈值和量产一致性。需要模型验证 + 独立实测。',
        quiz:{q:'哪一项可以仅由 11.5 W@50 kHz 的输出规格直接计算？',options:['所需 Nd:YVO₄ 掺杂浓度','紫外单脉冲能量约 230 μJ','LBO 的最优切割角','整机 8 小时 RMS 稳定性'],a:1,why:'E=P/f=11.5/50000 J=230 μJ；其余需要独立参数、模型或测试。'}}
    ]
  },
  {id:'fiber',label:'光纤激光',english:'FIBER LASERS',icon:'⌁',accent:'#436ec6',pale:'#eaf1ff',stage:'系统课程',
   summary:'从波导模式、光纤增益到 FBG 与环形腔，延伸到偏振、锁模和 SLM 光场调控。',
   outcomes:['理解光纤结构和 V 数','建立光纤振荡器与环形腔概念','理解偏振及空间模式耦合'],
   lessons:[
    {id:'fiber-01',title:'光纤激光器的结构地图',subtitle:'核心、包层、泵浦、增益与反馈',min:10,level:'基础',icon:'01',
     goals:['区分有源光纤与无源光纤','认识双包层泵浦','区分振荡器与放大器'],
     sections:[
       {title:'激光器为什么可以做在一根光纤里',body:'<p>光纤同时能提供<strong>光波导</strong>与掺杂增益介质。常见高功率掺镱（Yb）光纤激光器采用双包层结构：泵浦光在内包层传播并被纤芯吸收，信号光主要受纤芯约束。</p><p>相对块状激光器，长光纤有较大的散热面积，但高功率下仍有非线性、模态不稳定和热管理问题。</p>'},
       {title:'振荡器和放大器有何不同',body:'<p>振荡器需要反馈，例如两端 FBG 构成谐振腔；放大器则主要放大外部种子光，未必需要振荡反馈。<strong>MOPA</strong> 是先由种子振荡器产生信号，再通过一个或多个放大级提升功率。</p>'},
       {title:'两条经典光谱路线',body:'<p><strong>Yb 光纤</strong>常用于约 1 μm 工业光源；<strong>Er 光纤</strong>常用于约 1.55 μm 光通信和科研。这两个例子分别代表不同增益谱、泵浦策略和器件生态。</p>'}],
     misconception:'“光纤激光器的光一定是单模、一定线偏振”都不成立，必须看具体光纤和系统结构。',
     quiz:{q:'一个典型的光纤激光振荡器与光纤放大器最核心的区别是？',options:['是否使用电','是否具有构成振荡条件的反馈','是否一定 1550 nm','是否使用玻璃材料'],a:1,why:'光纤激光振荡器需要光学反馈；放大器则对输入信号提供增益。'}},
    {id:'fiber-02',title:'V 数、NA 与单模条件',subtitle:'从几何参数判断导模能力',min:14,level:'核心',icon:'02',interactive:'fiber',
     goals:['理解数值孔径 NA 与纤芯半径','计算阶跃折射率光纤 V 数','明白 V<2.405 的适用范围'],
     sections:[
       {title:'光纤不是简单的光线全反射',body:'<p>波动光学决定光纤能支持哪些传播模式。对理想圆形阶跃折射率光纤，归一化频率：</p><div class="formula">V = (2πa/λ) · NA</div><p>其中 <em>a</em> 是纤芯半径、λ 是真空波长、NA 是数值孔径。V 反映纤芯尺寸、波长和折射率差对模式数量的共同影响。</p>'},
       {title:'什么时候是单模',body:'<p>对于理想圆形阶跃折射率光纤，<span class="formula-inline">V&lt;2.405</span> 对应只有 LP₀₁ 基模导引（忽略偏振简并）；高于这个值可能出现更高阶模式。</p><p>这个规则不应直接照搬到光子晶体光纤、非标准折射率剖面或某些特殊大模场光纤。</p>'},
       {title:'调一个参数来做设计判断',body:'<p>试试下方 V 数计算器：固定 NA 和波长，逐渐增大纤芯半径，你会看到单模区向多模区转变。然后把波长从 1550 nm 改为 1064 nm，再观察 V 数变化。</p>'}],
     misconception:'单模只意味着导引的横向模式受限，不代表输出一定是严格线偏振。',
     quiz:{q:'其他条件不变时，光纤纤芯半径增大一倍，V 数如何变化？',options:['减半','不变','增大一倍','增大四倍'],a:2,why:'V 与纤芯半径 a 成正比。'}},
    {id:'fiber-03',title:'光纤激光器为什么不一定线偏振',subtitle:'普通单模、保偏光纤与偏振控制',min:11,level:'核心',icon:'03',
     goals:['区分空间单模与偏振态','理解双折射和保偏轴','理解偏振片与偏振控制器的区别'],
     sections:[
       {title:'单模 ≠ 单偏振',body:'<p>普通单模光纤主要限制横向导模，但通常仍存在两种偏振自由度。弯曲、应力、温度改变会使偏振态变化，因此普通单模光纤输出未必固定为线偏振。</p>'},
       {title:'保偏光纤在做什么',body:'<p>PM 光纤通过较强的设计双折射降低两个主轴之间的耦合。在正确沿主轴耦入且器件连接良好的条件下，它能更稳定地维持输入线偏振方向。</p><p>保偏不等于自动产生某一线偏振；系统的偏振质量仍需要通过 PER 等指标评价。</p>'},
       {title:'实际系统设计检查点',body:'<p>若后续使用偏振敏感器件（例如液晶 SLM、某些非线性晶体），要逐段确认偏振态与偏振相关损耗。不要仅凭“连接的是单模光纤”来推断 SLM 已获得合适偏振。</p>'}],
     misconception:'普通单模光纤可以空间单模，却不是自动保偏。',
     quiz:{q:'选择 PM 光纤后，哪种做法仍然必要？',options:['完全不需要对准偏振轴','正确沿保偏轴耦入并验证 PER','把 NA 设为零','移除所有光隔离器'],a:1,why:'PM 光纤本身不能弥补错误的轴向耦合与连接。'}},
    {id:'fiber-04',title:'1550 nm 环形腔与锁模基础',subtitle:'从增益、损耗到往返条件',min:13,level:'进阶',icon:'04',
     goals:['识别环形腔的关键器件','理解 OC、隔离器、滤波器功能','区分连续振荡与锁模脉冲'],
     sections:[
       {title:'一个典型环形腔长什么样',body:'<div class="flowchips"><span>980 nm 泵浦</span><b>+</b><span>EDF 增益</span><b>→</b><span>隔离器</span><b>→</b><span>滤波 / 偏振 / SLM</span><b>→</b><span>OC 输出耦合</span><b>↺</b></div><p>环形腔用一个闭合路径形成往返反馈。OC 取出部分光作为输出；隔离器规定单向传播；滤波和偏振器件调节腔内选择性损耗。</p>'},
       {title:'为什么损耗会影响能否起振',body:'<p>腔内一圈的净小信号增益必须克服所有损耗。自由空间器件、光纤准直器、SLM 等都会引入附加损耗，可能改变阈值和输出性能。</p><p>仅用 1550 nm ASE 测得的耦合效率，不能直接等同于锁模后激光腔的最终效率；光谱、模式、偏振和腔反馈状态都不同。</p>'},
       {title:'锁模的核心区别',body:'<p>连续振荡强调稳定平均功率；锁模则要求腔纵模间建立相干相位关系，形成周期性短脉冲。实现机理可能包含可饱和吸收、非线性偏振旋转等，不能只凭“环形腔闭合”认为它会锁模。</p>'}],
     misconception:'腔内出现 1550 nm 功率不代表已经实现稳定锁模，还应检查时域脉冲与 RF 频谱等。',
     quiz:{q:'环形光纤腔中的 OC（输出耦合器）主要做什么？',options:['把所有泵浦光转成紫外','提取一定比例的腔内光作输出','保证每束光都线偏振','直接测量 M²'],a:1,why:'OC 将部分腔内能量输出，同时让剩余光继续反馈。'}},
    {id:'fiber-05',title:'SLM 光场整形与光纤耦合',subtitle:'为高阶模式实验建立基础',min:14,level:'进阶',icon:'05',
     goals:['认识相位调制和振幅间接调制','理解光纤模场重叠决定耦合','区分高阶模式形状与相位结构'],
     sections:[
       {title:'SLM 实际上在调什么',body:'<p>反射式相位型液晶 SLM 主要控制光场相位。通过光栅、棋盘格或空间滤波，可以把部分能量分配到指定衍射级，实现间接振幅整形，但会付出效率损失。</p>'},

window.LASER_PRINCIPLES=[

 ['物理起点','<p>泵浦光被晶体吸收以后，为 Nd³⁺ 粒子建立反转。<strong>吸收功率不等于有效激光输出功率</strong>：部分能量以热释放，部分受到自发辐射、腔损耗和模式匹配限制。</p>'],
 ['第一个近似模型','<p>均匀吸收的一阶模型：P<sub>abs</sub> = P<sub>in</sub>[1−exp(−αL)]。这里 α 是泵浦波长吸收系数，L 为吸收路径长度。真实 Nd:YVO₄ 的吸收谱、泵浦线宽、双端泵和温升都会改变计算。</p>'],
 ['怎样用于设计','<p>先依据泵浦可聚焦性得到晶体内泵浦光斑，再计算 1064 nm 腔模的大小。二者需要有合适的横向重叠，同时限制热梯度与高阶模式增益。</p>']
 ],'solid-02'),
 principle('gaussian','solid','高斯光束与束腰','光斑、瑞利长度和波前曲率是一组耦合变量',[
 ['概念','<p>理想 TEM₀₀ 的强度分布 I(r)=I₀exp(−2r²/w²)。因此 w 是强度下降到中心 1/e² 时的半径，千万不要把“4.2 mm 光斑”误认为束腰半径。</p>'],
 ['传播规律','<p>w(z)=w₀√[1+(z/z<sub>R</sub>)²]；z<sub>R</sub>=πnw₀²/λ₀（均匀介质）。光斑半径、发散半角与波长无法独立随意调整。</p>'],
 ['工程使用边界','<p>它适合用于理想基模初算和腔模学习；真实 355 nm 光束含非理想模式和像差时，要使用 M²、二阶矩测量或空间传播模型。</p>']
 ],'solid-03'),
 principle('abcd','solid','ABCD 与自洽腔模','理解镜片距离为什么进入一整圈矩阵',[
 ['矩阵建立','<p>在同一坐标约定下，自由传播 P(d)=[[1,d],[0,1]]；薄透镜 F(f)=[[1,0],[−1/f,1]]；球面镜反射 M(R)=[[1,0],[−2/R,1]]。按实际传播顺序组合矩阵。</p>'],
 ['求解驻波腔','<p>往返矩阵 [[A,B],[C,D]] 的本征高斯参数满足 q=(Aq+B)/(Cq+D)，整理得 Cq²+(D−A)q−B=0。必须选择物理上 Im(q)>0 的解（具体与坐标约定相关）。</p>'],
 ['工程应用','<p>对三镜折叠腔，要把晶体厚度、折射率、热焦距、斜入射镜像散和返回路径分别纳入。<strong>单程几何总长度不能直接替代所有矩阵段。</strong></p>']
 ],'solid-03'),
 principle('stability','solid','谐振腔稳定性','冷腔稳定只是设计起点',[
 ['基础判据','<p>理想两镜谐振腔可用 g₁g₂ 判断，平凹腔内 0&lt;L&lt;R 为稳定区。更一般的无损近轴往返矩阵常用 |(A+D)/2|&lt;1 判定。</p>'],
 ['稳定性和增益是两回事','<p>几何稳定并不保证起振：实际输出还受增益、损耗、非线性转换和光学损伤控制。稳定边界附近也可能对装调和热透镜特别敏感。</p>'],
 ['设计时做什么','<p>在一组泵浦功率与热焦距范围内扫描腔模和稳定裕量，再决定是否采用某个曲率及腔长，而不是只验证名义点。</p>']

 principle('thermal','solid','固体晶体热透镜','从泵浦热源进入双轴谐振腔设计',[

 ['一阶近似','<p>热透镜可用 f<sub>th</sub> 表示：[[1,0],[−1/f<sub>th</sub>,1]]。等效焦距可能沿两个正交轴不同，也可能随泵浦功率、偏振与散热边界变化。</p>'],
 ['设计流程','<p>先计算冷腔，再加入标称热焦距及其变化范围。观察晶体、AOM、LBO 处光斑是否超出预期，并追踪 M²、像散及效率的变化。</p>']
 ],'solid-02'),
 principle('fold','solid','三镜折叠腔中的像散与位置','M2 不仅是折光，还会改变两轴模场',[

 ['斜入射效应','<p>若使用球面镜、入射角为 θ，可用 R<sub>t</sub>=Rcosθ、R<sub>s</sub>=R/cosθ 作为切向与弧矢方向的等效曲率（在相应曲率约定下）。两轴腔模可能不同。</p>'],

 ['漏光模式','<p>验收：泵浦 ON、DIO ON、RF 连续 ON、无 PWM 释放。要计算 AOM 是否能抑制 1064 nm 起振，并另行实测 355 nm 残余漏光。RF 高损耗状态不等于安全级关断。</p>'],
 ['FPS 的工程检验','<p>由连续抑制转为 PWM 时，储能可能产生异常首脉冲。FPS 可调节前几个脉冲的损耗与时序，但需同时检查首脉冲、后续过冲、能量和开光响应。</p>']

 ['相位条件','<p>Δk=k₃−k₂−k₁≈0 时，产生场能够沿晶体长度相干累积。温度、切割角、偏振、色散以及双折射走离都会改变最佳条件。</p>'],
 ['腔内与腔外的根本差别','<p>腔内转换提取 1064 nm 光子，会改变基频储能和调 Q 脉冲，因此转换器不能只是独立的“固定效率盒子”。两块晶体还需考虑前后程光路与绿光反射。</p>']

  <script>
(() => {
  const solid = (window.LASER_COURSES || []).find(c => c.id === 'solid');
  const lesson = solid?.lessons?.find(l => l.id === 'solid-03');
  if (lesson && !lesson.sections.some(s => /传播矩阵原理/.test(s.title))) {
    lesson.sections.splice(2, 0, {
      title:'传播矩阵原理：把一段光路写成 2×2',
      body:`<p>传播矩阵法的核心并不神秘：在近轴近似下，只要记录某一截面的<strong>光线高度</strong> <span class="formula-inline">y</span> 和<strong>倾角</strong> <span class="formula-inline">θ</span>，就可以把这一截面的光线状态写成列向量 <span class="formula-inline">[y, θ]<sup>T</sup></span>。光线经过任意一个简单光学段后，输出状态仍然与输入状态保持线性关系：</p>
      <div class="formula">[y₂, θ₂]<sup>T</sup> = [[A, B], [C, D]] [y₁, θ₁]<sup>T</sup></div>
      <p>因此，自由传播、薄透镜、球面镜、热透镜都能分别写成一个 2×2 矩阵；而完整光路只需要按经过顺序依次相乘。这就是“传播矩阵”或“ABCD 矩阵”的本质。</p>
      <div style="margin:14px 0;padding:14px;border:1px solid #e3eae6;border-radius:16px;background:#fbfcfb;overflow:auto">
        <svg viewBox="0 0 760 260" width="100%" role="img" aria-label="传播矩阵图解：自由传播、薄透镜与矩阵连乘">
          <defs>
            <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2d5e59"/></marker>
            <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d67c47"/></marker>
          </defs>

          <rect x="268" y="18" width="224" height="224" rx="16" fill="#ffffff" stroke="#dfe7e3"/>
          <rect x="524" y="18" width="224" height="224" rx="16" fill="#ffffff" stroke="#dfe7e3"/>
          <text x="30" y="44" font-size="18" font-weight="700" fill="#173430">① 自由传播</text>

          <line x1="60" y1="96" x2="194" y2="132" stroke="#2d5e59" stroke-width="3" marker-end="url(#arrA)"/>

          <text x="350" y="66" font-size="14" fill="#6a7974">焦距 f</text>
          <text x="316" y="206" font-size="18" fill="#173430">F(f) = [[1, 0], [−1/f, 1]]</text>
          <text x="294" y="226" font-size="12" fill="#6a7974">高度近似不变；角度被“折一下”</text>

          <text x="542" y="44" font-size="18" font-weight="700" fill="#173430">③ 连乘得到整段光路</text>

        </svg>
      </div>
      <div class="step-list"><div><b>Step 1 · 先定义截面</b><small>在某个参考面记录光线状态 <span class="formula-inline">[y, θ]</span>。</small></div><div><b>Step 2 · 写单段矩阵</b><small>自由空间、透镜、镜面、介质边界分别写出 ABCD。</small></div><div><b>Step 3 · 按顺序相乘</b><small>最先遇到的元件写在最右侧，最后遇到的写在最左侧。</small></div><div><b>Step 4 · 过渡到高斯模</b><small>把标量光线变量推广为复参数 <span class="formula-inline">q</span>，得到 <span class="formula-inline">q'=<span class="math-frac"><span>Aq+B</span><span>Cq+D</span></span></span>。</small></div></div>
      <p><a class="text-link" href="#/principle/raymatrix">展开图解原理专题 →</a>　<a class="text-link" href="#/formulas/solid">去看公式字母手册 →</a></p>`
    });

    if (Array.isArray(lesson.goals) && !lesson.goals.some(g => /传播矩阵/.test(g))) lesson.goals.push('理解传播矩阵如何从光线变量过渡到 q 参数');
  }

  if (!(window.LASER_PRINCIPLES || []).some(p => p.id === 'raymatrix')) {
    (window.LASER_PRINCIPLES = window.LASER_PRINCIPLES || []).push({
      id:'raymatrix', course:'solid', title:'传播矩阵原理（图解）', subtitle:'从 [y, θ] 到 q 参数，再到谐振腔往返矩阵', lesson:'solid-03',
      sections:[
        {title:'1. 先别急着记公式：矩阵到底在描述什么？', body:`<p>传播矩阵法的出发点，是把一条近轴光线在某个截面的状态写成两个量：<strong>光线离光轴的高度</strong> <span class="formula-inline">y</span>，以及<strong>相对光轴的倾角</strong> <span class="formula-inline">θ</span>。这两个量组成列向量 <span class="formula-inline">[y, θ]<sup>T</sup></span>。如果一个光学段足够接近近轴线性系统，那么输出一定可以写成输入的线性变换：</p><div class="formula">[y₂, θ₂]<sup>T</sup> = [[A, B], [C, D]] [y₁, θ₁]<sup>T</sup></div><p>所以，矩阵不是“为了数学而数学”，而是在告诉你：<strong>该光学段会怎样改变光线高度和传播方向</strong>。</p>`},
        {title:'2. 三个最常用的基本块', body:`<div style="margin:8px 0 14px;padding:14px;border:1px solid #e3eae6;border-radius:16px;background:#fbfcfb;overflow:auto"><svg viewBox="0 0 760 300" width="100%" role="img" aria-label="传播矩阵基本块图解"><rect x="16" y="18" width="228" height="264" rx="16" fill="#fff" stroke="#dfe7e3"/><rect x="266" y="18" width="228" height="264" rx="16" fill="#fff" stroke="#dfe7e3"/><rect x="516" y="18" width="228" height="264" rx="16" fill="#fff" stroke="#dfe7e3"/><text x="34" y="44" font-size="18" font-weight="700" fill="#173430">自由传播 P(d)</text><line x1="40" y1="130" x2="220" y2="130" stroke="#294944" stroke-width="2"/><line x1="58" y1="92" x2="196" y2="130" stroke="#2d5e59" stroke-width="3"/><line x1="58" y1="168" x2="196" y2="130" stroke="#2d5e59" stroke-width="3"/><text x="48" y="216" font-size="20" fill="#173430">[[1, d], [0, 1]]</text><text x="40" y="242" font-size="13" fill="#6a7974">高度变化 ∝ 传播距离；角度保持</text><text x="284" y="44" font-size="18" font-weight="700" fill="#173430">薄透镜 F(f)</text><line x1="290" y1="130" x2="470" y2="130" stroke="#294944" stroke-width="2"/><line x1="380" y1="72" x2="380" y2="188" stroke="#d67c47" stroke-width="6"/><line x1="320" y1="102" x2="380" y2="118" stroke="#2d5e59" stroke-width="3"/><line x1="380" y1="118" x2="440" y2="130" stroke="#2d5e59" stroke-width="3"/><line x1="320" y1="158" x2="380" y2="142" stroke="#2d5e59" stroke-width="3"/><line x1="380" y1="142" x2="440" y2="130" stroke="#2d5e59" stroke-width="3"/><text x="300" y="216" font-size="20" fill="#173430">[[1, 0], [−1/f, 1]]</text><text x="290" y="242" font-size="13" fill="#6a7974">高度近似不变；角度被聚焦改变</text><text x="534" y="44" font-size="18" font-weight="700" fill="#173430">球面镜 M(R)</text><line x1="540" y1="130" x2="708" y2="130" stroke="#294944" stroke-width="2"/><path d="M650 74 Q690 130 650 186" fill="none" stroke="#d67c47" stroke-width="6"/><line x1="560" y1="98" x2="648" y2="120" stroke="#2d5e59" stroke-width="3"/><line x1="648" y1="120" x2="574" y2="130" stroke="#2d5e59" stroke-width="3"/><line x1="560" y1="162" x2="648" y2="140" stroke="#2d5e59" stroke-width="3"/><line x1="648" y1="140" x2="574" y2="130" stroke="#2d5e59" stroke-width="3"/><text x="548" y="216" font-size="20" fill="#173430">[[1, 0], [−2/R, 1]]</text><text x="534" y="242" font-size="13" fill="#6a7974">反射后方向改变；常见于腔镜</text></svg></div><p>在谐振腔里，这三个基本块最常见：自由空间段、等效热透镜、曲面腔镜。复杂腔并不意味着需要全新公式，而是把这些基本块按实际顺序连起来。</p>`},
        {title:'3. 为什么顺序很重要？', body:`<p>矩阵乘法<strong>不可交换</strong>。先传播再过透镜，与先过透镜再传播，结果不同。因此写总矩阵时必须忠实记录真实光路顺序。例如：</p><div class="formula">M_total = P(d₂) · F(f) · P(d₁)</div><p>这表示：光线先在右边的 <span class="formula-inline">P(d₁)</span> 中传播，再通过透镜 <span class="formula-inline">F(f)</span>，最后传播 <span class="formula-inline">P(d₂)</span>。当你做三镜折叠腔时，要把每个元件与每段距离都拆开写清楚，而不是直接把总长度塞进一个两镜公式。</p>`},
        {title:'4. 从光线传播到高斯模传播', body:`<p>传播矩阵最初描述的是几何光线，但高斯光束同样服从 ABCD 形式。把光束写成复参数 <span class="formula-inline">q</span> 后，有：</p><div class="formula">q' = (Aq + B) / (Cq + D)</div><p>其中 <span class="formula-inline">1/q = 1/R - iλ/(πw²)</span>（具体符号随约定略有不同）。解出谐振腔的自洽条件后，你就能知道束腰位置、各镜面光斑和晶体内光斑。也就是说：</p><div class="step-list"><div><b>光线矩阵</b><small>帮助你理解元件对 <span class="formula-inline">y, θ</span> 的作用。</small></div><div><b>q 参数传播</b><small>帮助你求 TEM₀₀ 腔模和各处光斑尺寸。</small></div><div><b>往返矩阵</b><small>帮助你判断稳定性与热透镜容差。</small></div></div>`},
        {title:'5. 在 355 nm 折叠腔里怎么用？', body:`<p>对 Nd:YVO₄ 三镜折叠腔，推荐按下面顺序练习：</p><div class="step-list"><div><b>01 · 两镜空腔</b><small>先用平凹腔建立对稳定区、束腰和镜面光斑的直觉。</small></div><div><b>02 · 加入热透镜</b><small>把 Nd:YVO₄ 等效为薄透镜，看稳定区如何漂移。</small></div><div><b>03 · 改为折叠腔</b><small>加入 M2，并把前后臂分段写出总矩阵。</small></div><div><b>04 · 分两轴处理</b><small>若 M2 斜入射，分别计算切向/弧矢方向 ABCD。</small></div><div><b>05 · 沿腔传播 q</b><small>求出 AOM、SHG、SFG 晶体处的光斑大小，为选型与位置优化服务。</small></div></div><p><a class="text-link" href="#/lesson/solid-03">回到《高斯光束、ABCD 与腔长》 →</a>　<a class="text-link" href="#/lesson/solid-04">继续学习三镜折叠腔 →</a></p>`}
      ]
    });
  }
})();
  </script>

  <script>
(() => {
  'use strict';
  const p=(window.LASER_PRINCIPLES||[]).find(x=>x.id==='raymatrix');
  const lessons=window.LASER_COURSES?.find(x=>x.id==='solid')?.lessons||[];
  const lesson=lessons.find(x=>x.id==='solid-03');
  if(lesson){
    const target=lesson.sections.find(x=>x.title.includes('传播矩阵原理'));
    if(target){
      target.body=target.body.replace(/<p>传播矩阵法的核心/, '<div class="matrix-learning-alert"><b>今日学习目标：</b>理解 2×2 矩阵怎样描述高度与角度的变化，能自己推导自由空间和薄透镜矩阵，并能正确判断连乘顺序。</div><p>传播矩阵法的核心');
    }
  }
  if(p){
    p.sections.forEach(x=>{x.title=x.title.replace(/^\d+\.\s*/, '');});
    p.sections.splice(0,0,{
      title:'矩阵乘法基础：为什么是“行乘列”？',
      body:`<p>一条光线只需要两个变量，所以 2×2 矩阵足够。设一个矩阵 <span class="formula-inline">M=[[a,b],[c,d]]</span>，输入列向量为 <span class="formula-inline">r=[y,θ]ᵀ</span>：</p><div class="formula">M r = [ay + bθ, cy + dθ]ᵀ</div><p>含义是：<strong>输出高度</strong>由输入高度与角度共同决定；<strong>输出角度</strong>也由输入高度与角度共同决定。两行分别对应两个输出量，这就是“行乘列”的由来。</p><div class="matrix-learning-alert"><b>特别重要：</b>矩阵乘法不满足一般交换律。光路的先后顺序是真实物理信息，不能把元件顺序随意颠倒。</div>`
    });
    p.sections.push({
      title:'6. 动手计算：传播 → 透镜 → 传播',
      body:`<p>用真实的数值验证矩阵连乘。下面这套模型是：<b>先在空气中传播 d₁ → 经过焦距 f 的理想薄透镜 → 再传播 d₂</b>。输入是一条近轴光线的高度 y₀ 和倾角 θ₀。你可以拖动参数，然后逐段核对计算。</p>
      <div class="matrix-lab" id="matrixLab">
        <div class="matrix-lab-head"><strong>光线传播矩阵 · 交互练习</strong><button type="button" class="ml-clear" data-ml-reset>恢复书本例子</button></div>
        <div class="matrix-lab-grid">
          <label>d₁ · 透镜前距离 <span class="ml-value" data-ml="d1v">100 mm</span><input id="mlD1" type="range" min="0" max="300" step="10" value="100"/></label>
          <label>f · 透镜焦距 <span class="ml-value" data-ml="fv">200 mm</span><input id="mlF" type="range" min="50" max="500" step="10" value="200"/></label>
          <label>d₂ · 透镜后距离 <span class="ml-value" data-ml="d2v">100 mm</span><input id="mlD2" type="range" min="0" max="300" step="10" value="100"/></label>
          <label>y₀ · 初始高度 <span class="ml-value" data-ml="y0v">1.0 mm</span><input id="mlY0" type="range" min="-3" max="3" step="0.5" value="1"/></label>
          <label>θ₀ · 初始倾角 <span class="ml-value" data-ml="t0v">0.0 mrad</span><input id="mlT0" type="range" min="-20" max="20" step="1" value="0"/></label>
        </div>
        <div class="ml-diagram">
          <svg viewBox="0 0 760 260" role="img" aria-label="可调自由传播、薄透镜和输出光线图">
            <rect x="12" y="12" width="736" height="236" rx="13" fill="#fcfefd" stroke="#e6efe9"/>
            <line x1="50" y1="132" x2="705" y2="132" stroke="#b2c8bc" stroke-width="2" stroke-dasharray="7 5"/>
            <line x1="376" y1="34" x2="376" y2="232" stroke="#d67c47" stroke-width="7"/>
            <text x="60" y="36" font-size="17" fill="#466e5a">输入</text><text x="337" y="27" font-size="17" fill="#ba6b3d">薄透镜 f</text><text x="650" y="36" font-size="17" fill="#466e5a">输出</text>
            <text x="158" y="220" font-size="17" fill="#466e5a">自由传播 d₁</text><text x="490" y="220" font-size="17" fill="#466e5a">自由传播 d₂</text>
            <polyline id="mlRay" points="60,105 376,105 700,165" fill="none" stroke="#14795c" stroke-width="4" stroke-linejoin="round"/>
            <circle id="mlDotIn" cx="60" cy="105" r="6" fill="#14795c"/><circle id="mlDotAtLens" cx="376" cy="105" r="6" fill="#14795c"/><circle id="mlDotOut" cx="700" cy="165" r="6" fill="#14795c"/>
            <text x="50" y="247" font-size="12" fill="#779285">图形按自适应比例显示，说明近轴方向变化；不是实际毫米尺寸的机械光路图</text>
          </svg>
        </div>
        <div class="ml-cards">
          <div class="ml-result"><span>A · 无量纲</span><strong data-ml="A">0.5000</strong></div>
          <div class="ml-result"><span>B · m</span><strong data-ml="B">0.1500 m</strong></div>
          <div class="ml-result"><span>C · m⁻¹</span><strong data-ml="C">−5.0000 m⁻¹</strong></div>
          <div class="ml-result"><span>D · 无量纲</span><strong data-ml="D">0.5000</strong></div>
          <div class="ml-result"><span>最终光线高度 y₂</span><strong data-ml="yout">0.500 mm</strong></div>
          <div class="ml-result"><span>最终倾角 θ₂</span><strong data-ml="tout">−5.000 mrad</strong></div>
        </div>
        <div class="ml-steps">
          <div><span class="ml-step-title">① 传播：</span><span data-ml="step1">yₐ = y₀ + d₁θ₀ = 1.000 mm</span></div>
          <div><span class="ml-step-title">② 透镜：</span><span data-ml="step2">θᵦ = θ₀ − yₐ/f = −5.000 mrad</span></div>
          <div><span class="ml-step-title">③ 再传播：</span><span data-ml="step3">y₂ = yₐ + d₂θᵦ = 0.500 mm</span></div>
          <div><span class="ml-step-title">④ 连乘验证：</span><span data-ml="verify">矩阵连乘结果与逐段计算一致</span></div>
        </div>
        <p class="ml-note">采用空气中的坐标 r=[y(m), θ(rad)]ᵀ，透镜正焦距为会聚透镜；输入端为毫米与毫弧度，计算时统一转换为 SI 单位。B 的单位是 m，C 的单位是 m⁻¹。此练习为单程光线传播，不是完整的固体激光谐振腔计算。</p>
      </div>
      <details class="theory-mini-quiz"><summary>自测题：只在空气中传播 200 mm，y=1 mm、θ=2 mrad，输出是多少？</summary><p>由 y₂=y₁+dθ₁，可得 y₂=1 mm+200 mm×0.002=1.4 mm，角度依然为 2 mrad。</p></details>
      <p><a class="text-link" href="#/formulas/solid">打开公式符号手册：查 A、B、C、D、y、θ 的含义 →</a></p>`
    });
  }
  const terms=window.LASER_TERMS||[];
  for(const t of [
    {id:'paraxial',course:'solid',name:'近轴近似',short:'光线相对光轴倾角较小、离轴距离相对系统尺寸较小的一阶光学近似。',detail:'在该条件下 sinθ≈tanθ≈θ（弧度），可把光线传播线性化。',application:'ABCD 矩阵适用于近轴传播；高数值孔径和明显像差的情况需升级模型。',aliases:['近轴近似'],principle:'raymatrix'},
    {id:'rayvector',course:'solid',name:'光线状态向量',short:'在某个参考截面用光线高度 y 与传播倾角 θ 组成的二元列向量。',detail:'r=[y,θ]ᵀ，其中上标 T 表示转置。',application:'每个光学元件把输入状态变成输出状态，可写成 2×2 矩阵乘法。',aliases:['光线状态向量','状态向量'],principle:'raymatrix'}
  ])if(!terms.some(x=>x.id===t.id))terms.push(t);

  const F=window.LASER_FORMULAS||[];
  const sym=(key,label,meaning,unit,insight)=>({key,label,meaning,unit,insight});
  const eq=(key,markup)=>`<span class="eq-symbol" tabindex="0" role="button" data-sym="${key}" aria-label="查看 ${key} 的含义">${markup}</span>`;
  const extra=[
    {id:'s-ray-vector',course:'solid',stage:3,title:'近轴光线状态向量 / 传输矩阵',expression:`[${eq('y2','y₂')},${eq('theta2','θ₂')}]ᵀ = [[${eq('A','A')},${eq('B','B')}],[${eq('C','C')},${eq('D','D')}]] [${eq('y1','y₁')},${eq('theta1','θ₁')}]ᵀ`,symbols:[sym('y1','y₁','输入截面相对光轴高度','m','可以为正或负'),sym('theta1','θ₁','输入光线相对光轴的角度','rad','近轴时角度用弧度'),sym('y2','y₂','输出截面相对光轴高度','m','由矩阵第一行求得'),sym('theta2','θ₂','输出光线倾角','rad','由矩阵第二行求得'),sym('A','A','对输入光线高度的比例系数','无量纲','A表示高度对高度的贡献'),sym('B','B','输入角度对输出高度的耦合系数','m','与传播路径有关'),sym('C','C','输入高度对输出角度的耦合系数','m⁻¹','与透镜、反射镜聚焦有关'),sym('D','D','输入角度对输出角度的系数','无量纲','应使用一致的坐标约定')],note:'近轴空气光线状态 r=[y(m),θ(rad)]ᵀ；跨折射率边界时需使用对应折射矩阵，或改用 r=[y,nθ]ᵀ 的约定。',example:'一段 0.1 m 自由传播满足 y₂=y₁+0.1θ₁，θ₂=θ₁。'},
    {id:'s-free-ray',course:'solid',stage:3,title:'自由空间传播矩阵',expression:`P(${eq('d','d')}) = [[1, ${eq('d','d')}], [0, 1]]`,symbols:[sym('d','d','从输入截面到输出截面的传播距离','m','空气中若 d=100 mm，矩阵上右元素为0.1 m')],note:'适用于同一均匀介质、近轴光线；此处以空气中的 y,θ 为状态变量。',example:'d=100 mm：P(d)=[[1,0.1],[0,1]]（长度单位统一采用 m）。'},
    {id:'s-lens-ray',course:'solid',stage:3,title:'理想薄透镜矩阵',expression:`F(${eq('f','f')}) = [[1, 0], [<span class="math-frac"><span>−1</span><span>${eq('f','f')}</span></span>, 1]]`,symbols:[sym('f','f','薄透镜焦距','m','会聚透镜 f>0，发散透镜 f<0')],note:'忽略厚透镜主平面、像差和孔径效应；采用空气中的 [y,θ]ᵀ 坐标。',example:'f=0.2 m 时 C=−5 m⁻¹。'},
    {id:'s-mirror-ray',course:'solid',stage:3,title:'球面镜反射等效矩阵',expression:`M(${eq('R','R')}) = [[1, 0], [<span class="math-frac"><span>−2</span><span>${eq('R','R')}</span></span>, 1]]`,symbols:[sym('R','R','球面镜曲率半径（采用反射后展开光路约定）','m','此约定下会聚凹面镜取 R>0')],note:'用反射后展开的局部传播坐标表示单次镜面反射；切向/弧矢方向和其他符号约定需分别处理。',example:'凹面镜 R=0.3 m 时 C≈−6.667 m⁻¹。'}
  ];
  for(const f of extra)if(!F.some(x=>x.id===f.id))F.push(f);
  const $=(id)=>document.getElementById(id);
  const set=(name,value)=>{const e=document.querySelector('#matrixLab [data-ml="'+name+'"]');if(e)e.textContent=value;};
  const fmt=(x,dp=3)=>{let v=Number(x).toFixed(dp);return v.startsWith('-')?'−'+v.slice(1):v;};
  function matrixUpdate(){if(!$ ('matrixLab'))return;
    const d1=Number($('mlD1').value)/1000,d2=Number($('mlD2').value)/1000,f=Number($('mlF').value)/1000;
    const y0=Number($('mlY0').value)/1000,t0=Number($('mlT0').value)/1000;
    const yLens=y0+d1*t0,tLens=t0-yLens/f,yOut=yLens+d2*tLens;
    const A=1-d2/f,B=d1+d2-d1*d2/f,C=-1/f,D=1-d1/f;
    const yCheck=A*y0+B*t0,tCheck=C*y0+D*t0;
    set('d1v',fmt(d1*1000,0)+' mm');set('d2v',fmt(d2*1000,0)+' mm');set('fv',fmt(f*1000,0)+' mm');set('y0v',fmt(y0*1000,1)+' mm');set('t0v',fmt(t0*1000,1)+' mrad');
    set('A',fmt(A,4));set('B',fmt(B,4)+' m');set('C',fmt(C,4)+' m⁻¹');set('D',fmt(D,4));
    set('yout',fmt(yOut*1000)+' mm');set('tout',fmt(tLens*1000)+' mrad');
    set('step1','yₐ = y₀ + d₁θ₀ = '+fmt(yLens*1000)+' mm');
    set('step2','θᵦ = θ₀ − yₐ/f = '+fmt(tLens*1000)+' mrad');
    set('step3','y₂ = yₐ + d₂θᵦ = '+fmt(yOut*1000)+' mm');
    set('verify',(Math.abs(yOut-yCheck)<1e-10&&Math.abs(tLens-tCheck)<1e-10)?'逐段计算 = 总矩阵计算 ✓':'请检查数值精度');
    const max=Math.max(2.5,Math.abs(y0*1000),Math.abs(yLens*1000),Math.abs(yOut*1000))*1.12;
    const yy=(mm)=>Math.max(35,Math.min(229,132-95*mm/max));
    const pts=[[60,yy(y0*1000)],[376,yy(yLens*1000)],[700,yy(yOut*1000)]];
    const svg=$('mlRay');if(svg)svg.setAttribute('points',pts.map(p=>p.join(',')).join(' '));
    ['mlDotIn','mlDotAtLens','mlDotOut'].forEach((id,i)=>{const el=$(id);if(el){el.setAttribute('cx',pts[i][0]);el.setAttribute('cy',pts[i][1]);}});
  }
  document.addEventListener('input', e=>{if(e.target.closest('#matrixLab'))matrixUpdate()});
  document.addEventListener('click', e=>{if(e.target.closest('[data-ml-reset]')){

  }});
  const target=$('page');if(target)new MutationObserver(()=>{if($('matrixLab'))matrixUpdate()}).observe(target,{childList:true,subtree:false});
  document.addEventListener('DOMContentLoaded',matrixUpdate,{once:true});
})();
  </script>

  const formulaMini=`<div class="math-two-column"><div class="math-theory-card"><h3>自由空间传播</h3>${E('<span>P(d)</span>','<span>=</span>',M('1','d','0','1'))}<p>第一行：y₂ = y₁ + dθ₁；第二行：θ₂ = θ₁。</p></div><div class="math-theory-card"><h3>薄透镜 / 热透镜</h3>${E('<span>F(f)</span>','<span>=</span>',M('1','0',Fr('−1','f'),'1'))}<p>第一行：y₂ = y₁；第二行：θ₂ = θ₁ − y₁${Fr('1','f')}。</p></div><div class="math-theory-card"><h3>球面镜反射（展开光路）</h3>${E('<span>M(R)</span>','<span>=</span>',M('1','0',Fr('−2','R'),'1'))}<p>在这里采用凹面镜 R &gt; 0 的反射后展开坐标约定。</p></div><div class="math-theory-card"><h3>任意一段近轴系统</h3>${E('<span>M</span>','<span>=</span>',M('A','B','C','D'))}<p>A、D 无量纲；B 的单位是 m，C 的单位是 m⁻¹。</p></div></div>`;

  if(course){
    const target=course.sections.find(x=>x.title.includes('传播矩阵原理'));
    if(target){target.title='光线传播矩阵：从数学复习到光路计算';target.body=`<p>还记得矩阵的<strong>行乘列</strong>吗？它在光学里有特别直观的意义：第一行算光线走到哪里，第二行算光线向哪边走。先不急着背 ABCD，我们把公式写成真正的方阵：</p>${B(resultEquation,'把右侧列向量依次乘上矩阵的两行，就分别得到 y₂ 与 θ₂。')}<p>先用一个标准例子理解矩阵，再回到光线传播。记住 <strong>自由传播改变高度，薄透镜改变倾角</strong>，你就能自己推导出两个最常见的光学矩阵。</p>${formulaMini}<p>上面每个方阵都可以独立拼接成复杂光路。<a class="text-link" href="#/principle/raymatrix">进入详细推导与交互练习 →</a>，跟着每一步把公式真正算出来。</p>`;}
    const next=course.sections.find(x=>x.title.includes('从两镜扩展到折叠腔'));
    if(next)next.body=`<p>当光路里有多段空气、晶体和折叠腔镜时，关键是保持每一段的先后顺序。一个往返系统的矩阵写成：</p>${B(E('<span>M<sub>rt</sub></span>','<span>=</span>',M('A','B','C','D')),'真实 M<sub>rt</sub> 需要从 M1 出发，沿谐振腔一整圈返回同一参考面后依次相乘。')}<p>对高斯基模，复光束参数满足 <span class="formula-inline">q = ${Fr('Aq+B','Cq+D')}</span>；这一步在学会基础矩阵之后再推，不需要今天就把它记住。<a class="text-link" href="#/principle/raymatrix">先回到基础推导 →</a></p>`;
    course.min=25;
  }
  const pump=solid?.lessons?.find(x=>x.id==='solid-02');
  if(pump){const th=pump.sections.find(x=>x.title.includes('热透镜到底改了什么'));if(th){th.body=`<p>高斯泵浦造成非均匀温度分布，晶体的波前在初步分析中可用一块等效薄透镜描述。记住：它的焦距是随泵浦状态变化的，不是固定的玻璃透镜。</p>${B(E('<span>M<sub>thermal</sub></span>','<span>=</span>',M('1','0',Fr('−1','f<sub>th</sub>'),'1')),'热透镜焦距 f<sub>th</sub> 是测量或热模型给出的等效参数。')}<p>在腔模计算中，热透镜与腔长、腔镜曲率共同决定稳定性，不能用冷腔尺寸代替工作状态。</p>`;}}

  if(p){
    const lab=p.sections.find(x=>x.title.includes('动手计算'));
    // Keep the existing fully tested slider logic, but replace the awkward horizontal coefficient cards.
    if(lab){
      const k=lab.body.indexOf('<div class="ml-cards">');
      const z=lab.body.indexOf('<div class="ml-steps">',k);
      if(k>=0&&z>k){
        const liveMat=M('<span data-ml="A">0.5000</span>','<span data-ml="B">0.1500 m</span>','<span data-ml="C">−5.0000 m⁻¹</span>','<span data-ml="D">0.5000</span>');
        const liveVec=V('<span data-ml="yout">0.500 mm</span>','<span data-ml="tout">−5.000 mrad</span>');
        const panel=`<div class="math-lab-showcase"><h4>当前光路的总 ABCD 矩阵（真正的 2×2 方阵）</h4>${E('<span>M<sub>total</sub></span>','<span>=</span>',liveMat)}<div class="math-lab-order">先 P(d₁) → 后 F(f) → 最后 P(d₂)，因此 M<sub>total</sub> = P(d₂) · F(f) · P(d₁)</div><div class="math-lab-output"><div><h4>输出光线状态</h4><div class="math-note">显示单位为 mm 和 mrad；代入矩阵运算前统一换算为 m 与 rad。</div></div>${E('<span>r<sub>out</sub></span>','<span>=</span>',liveVec)}</div></div>`;
        lab.body=lab.body.slice(0,k)+panel+lab.body.slice(z);
      }
      lab.body=lab.body.replace('用真实的数值验证矩阵连乘。下面这套模型是：','现在请自己动手改变数字。下面的模型是：');
    }
    p.subtitle='矩阵乘法 → 高度与倾角 → 自由传播 → 透镜 → 反射镜 → 连乘与实验';
    p.sections=[
      {title:'第一步：先复习矩阵的“行乘列”',body:`<p>先不谈激光器。矩阵就是把一组线性关系组织成方形表格。比如：</p>${B(E(example,V('5','6'),'<span>=</span>',V('17','39')),'第一行：1×5 + 2×6 = 17。第二行：3×5 + 4×6 = 39。')}<p>只要明白这两次运算，传播矩阵就不神秘。<strong>每一行负责计算一个输出量，每一列对应一个输入量。</strong>光学里的 ABCD 也完全遵循这个规则。</p><details class="theory-mini-quiz"><summary>试着自己算：第二行的 39 从哪来？</summary><p>第三个矩阵元 3 乘输入高度 5，第四个矩阵元 4 乘输入 6，所以 3×5+4×6=39。</p></details>`},
      {title:'第二步：为什么光线只需要两个数字？',body:`<p>在近轴光学里，一条光线在某个截面可以用两个变量描述：<b>y</b> 是它离光轴有多高，<b>θ</b> 是它相对于光轴倾斜多少。把这两个数从上到下写成一列：</p>${B(E('<span>r</span>','<span>=</span>',V('y','θ')),'列向量不是两个互不相关的符号：y 决定位置，θ 决定走向。')} ${demoFig}<p>通过一段光学系统之后，光线变成新的 <b>y₂、θ₂</b>；在近轴条件下，可以由输入 y₁、θ₁ 线性计算：</p>${B(resultEquation,'第一行：y₂ = Ay₁+Bθ₁；第二行：θ₂ = Cy₁+Dθ₁。')}<p><strong>四个字母的意义：</strong>A 是高度→高度，B 是角度→高度，C 是高度→角度，D 是角度→角度。采用 y(m)、θ(rad) 约定时，A 和 D 无量纲，B 的单位为 m，C 的单位为 m⁻¹。</p>`},
      {title:'第三步：自己推导自由传播矩阵 P(d)',body:`<p>从输入面走到输出面，中间没有透镜。光线方向不变：<b>θ₂ = θ₁</b>。但是光线有倾角，所以高度会变化。由直角三角形：</p><div class="math-step-formula">y₂ = y₁ + d · tanθ₁ ≈ y₁ + dθ₁</div><p>最后的约等号来自近轴条件：当 θ 以弧度表示、角度很小时 tanθ≈θ。</p>${demoFig}${B(E('<span>P(d)</span>','<span>=</span>',M('1','d','0','1')),'你不需要死记：直接把 y₂ = 1·y₁ + d·θ₁，θ₂ = 0·y₁ + 1·θ₁ 的系数按两行摆进去即可。')}<p>注意：<strong>自由传播矩阵左下角是 0</strong>，因为在均匀空间里光线倾角不随传播距离改变。</p>`},
      {title:'第四步：自己推导薄透镜矩阵 F(f)',body:`<p>薄透镜的作用与自由传播刚好不同：我们把薄透镜的厚度近似为零，因此<strong>穿过透镜的高度不变</strong>，但是传播方向发生变化。</p><div class="math-step-formula">y₂ = y₁</div><div class="math-step-formula">θ₂ = θ₁ − y₁${Fr('1','f')}</div>${lensFig}${B(E('<span>F(f)</span>','<span>=</span>',M('1','0',Fr('−1','f'),'1')),'上面两行方程的系数，恰好就是四个矩阵元；正焦距 f 为会聚透镜。')}<p>想一下为什么左下角是 <span class="formula-inline">${Fr("−1","f")}</span>：入射高度 y₁ 越大，透镜让光线转过的角度越大。对固体激光器而言，<strong>增益晶体的等效热透镜</strong>在初步近轴计算中也可以先用这个矩阵描述。</p>`},
      {title:'第五步：球面反射镜与热透镜',body:`<p>球面镜会让光线的传播方向改变。把反射之后的路径“展开”为正向传播的局部坐标，凹面球面镜可以看成等效焦距 f=R/2 的聚焦元件：</p>${B(E('<span>M(R)</span>','<span>=</span>',M('1','0',Fr('−2','R'),'1')),'此处规定会聚凹面镜 R>0；不同书籍若反射坐标与曲率符号不同，矩阵的符号也需相应统一。')}<p>这就解释了为什么谐振腔镜片的<strong>曲率半径 R</strong>会影响腔模，而平面反射镜的近轴聚焦作用可以令 R→∞ 得到零。</p>${B(E('<span>F<sub>th</sub></span>','<span>=</span>',M('1','0',Fr('−1','f<sub>th</sub>'),'1')),'热透镜与薄透镜使用同一数学结构，fth 要随泵浦与散热条件变化。')}`},
      {title:'第六步：一段光路为什么是“右边先乘”？',body:`<p>设光线先传播 <b>d₁</b>，再经过焦距 <b>f</b> 的透镜，最后传播 <b>d₂</b>。写成三个变换：</p>${B(E('<span>M<sub>total</sub></span>','<span>=</span>',M('1','d₂','0','1',true),M('1','0',Fr('−1','f'),'1',true),M('1','d₁','0','1',true)),'从右向左依次作用在输入列向量上：先 P(d₁)，再 F(f)，最后 P(d₂)。') }<p>为什么不能交换？因为同样一段自由传播，放在透镜前后时，透镜处的光线高度不同，所以折射角也不同。</p><div class="math-explain">你可以把矩阵乘法理解为“光学操作说明书”：最右侧先执行，执行完把输出交给它左边的元件，最终得到整段光路的结果。</div>`},
      lab||{title:'第七步：自己代入数字',body:'<p>本节动态计算器暂不可用。</p>'},
      {title:'扩展阅读：从传播矩阵到高斯光束 q',body:`<p>学完上面各步，你会知道传播矩阵本来描述的是一条几何光线。高斯光束除了中心光线，还包含光斑半径和波前曲率。把这些性质编码成复参数 q，就能继续使用相同的 A、B、C、D：</p>${B(E('<span>q₂</span>','<span>=</span>','<span>(Aq₁ + B) / (Cq₁ + D)</span>'),'这不是两条几何光线的列向量，而是描述高斯光束波前和光斑的复参数传播公式。')}<p>在真正的三镜折叠腔中，要先得到返回同一参考面的<strong>往返矩阵</strong>：</p>${B(E('<span>M<sub>rt</sub></span>','<span>=</span>',M('A','B','C','D')),'之后求自洽高斯腔模 q，并沿各段传播到 Nd:YVO₄、AOM 和两块 LBO 的位置。')}<p>这一部分先作为后续学习的接口。今天最关键的是把前面的矩阵来源、行乘列和先后顺序弄明白。</p><p><a class="text-link" href="#/lesson/solid-03">返回固体激光第三阶段 →</a>　<a class="text-link" href="#/formulas/solid">记忆公式符号 →</a></p>`}
    ];
    p.sections[6].title='第七步：动手计算，检验你的矩阵';
  }

  // Other physical-theory pages use the same standard display, so learners never see a raw [[a,b],[c,d]].
  const ab=(window.LASER_PRINCIPLES||[]).find(x=>x.id==='abcd');
  if(ab){
    const sec=ab.sections.find(x=>x.title==='矩阵建立');if(sec)sec.body=`<p>先选定统一坐标，在同一均匀介质中把每段自由传播和每块透镜、球面镜转换成方阵。<b>真实顺序从右向左相乘</b>。</p>${formulaMini}<p><a class="text-link" href="#/principle/raymatrix">回到“矩阵为什么这样写”的逐步推导 →</a></p>`;
    const step=ab.sections.find(x=>x.title==='求解驻波腔');if(step)step.body=`<p>往返矩阵必须从一个参考面出发，回到同一截面。矩阵形式如下：</p>${B(E('<span>M<sub>rt</sub></span>','<span>=</span>',M('A','B','C','D')),'对稳定的高斯模，可进一步施加自洽条件 q=(Aq+B)/(Cq+D)，求出束腰及各处光斑。')}<p>这里的 A、B、C、D 不是任意常数，而是由镜面曲率、晶体厚度和实际距离共同计算得到的。</p>`;
  }
  const therm=(window.LASER_PRINCIPLES||[]).find(x=>x.id==='thermal');
  if(therm){const sec=therm.sections.find(x=>x.title==='一阶近似');if(sec)sec.body=`<p>热透镜等效焦距 f<sub>th</sub> 由泵浦、偏振及散热条件决定。作为薄透镜的近轴近似：</p>${B(E('<span>M<sub>th</sub></span>','<span>=</span>',M('1','0',Fr('−1','f<sub>th</sub>'),'1')),'标称值和可能的焦距范围都要进入谐振腔稳定性扫描。')}`;}

  // Formula reference: every optical matrix now really has rows, columns and square brackets.
  const F=window.LASER_FORMULAS||[];
  const byId=id=>F.find(x=>x.id===id);
  const setExpr=(id,x)=>{const f=byId(id);if(f)f.expression=x;};
  setExpr('s-ray-vector',E(V(S('y2','y₂'),S('theta2','θ₂')),'<span>=</span>',M(S('A','A'),S('B','B'),S('C','C'),S('D','D')),V(S('y1','y₁'),S('theta1','θ₁'))));
  setExpr('s-free-ray',E('<span>P('+S('d','d')+')</span>','<span>=</span>',M('1',S('d','d'),'0','1')));
  setExpr('s-lens-ray',E('<span>F('+S('f','f')+')</span>','<span>=</span>',M('1','0',Fr('−1',S('f','f')),'1')));
  setExpr('s-mirror-ray',E('<span>M('+S('R','R')+')</span>','<span>=</span>',M('1','0',Fr('−2',S('R','R')),'1')));
  setExpr('s-thermal',E('<span>M<sub>th</sub></span>','<span>=</span>',M('1','0',Fr('−1',S('fth','f<sub>th</sub>')),'1')));
  const round=byId('s-matrix');if(round)round.expression=`${E('<span>M<sub>rt</sub></span>','<span>=</span>',M(S('A','A'),S('B','B'),S('C','C'),S('D','D')))}<div class="math-under">高斯腔模自洽条件：q = ${Fr('Aq+B','Cq+D')}。各字母请点击查询。</div>`;

  // Author-existing non-matrix-topic sections may include a literal [[ ... ]] syntax; convert their content, too.
  const bracket=/\[\[\s*([^,\[\]]+?)\s*,\s*([^,\[\]]+?)\s*\]\s*,\s*\[\s*([^,\[\]]+?)\s*,\s*([^,\[\]]+?)\s*\]\]/g;
  for(const c of window.LASER_COURSES||[])for(const l of c.lessons||[])for(const section of l.sections||[])if(!section.body.includes('<svg'))section.body=section.body.replace(bracket,(_,a,b,c,d)=>M(a.trim(),b.trim(),c.trim(),d.trim(),true));
  for(const t of window.LASER_PRINCIPLES||[])for(const section of t.sections||[])if(!section.body.includes('<svg'))section.body=section.body.replace(bracket,(_,a,b,c,d)=>M(a.trim(),b.trim(),c.trim(),d.trim(),true));
  for(const f of F)if(f.expression.includes('[['))f.expression=f.expression.replace(bracket,(_,a,b,c,d)=>M(a.trim(),b.trim(),c.trim(),d.trim(),true));
})();

  </script>

<script>
(() => {
  'use strict';
  const M=(a,b,c,d)=>`<span class="sq-mat" role="math"><span class="sq-mat-grid"><span class="sq-cell">${a}</span><span class="sq-cell">${b}</span><span class="sq-cell">${c}</span><span class="sq-cell">${d}</span></span></span>`;
  const V=(a,b)=>`<span class="sq-mat sq-mat-vec" role="math"><span class="sq-mat-grid"><span class="sq-cell">${a}</span><span class="sq-cell">${b}</span></span></span>`;
  const E=(...items)=>`<div class="matrix-math-scroll"><div class="matrix-math-eq">${items.join('')}</div></div>`;
  const D=(items,desc='')=>`<div class="tech-equation">${E(...items)}${desc?`<div class="math-under">${desc}</div>`:''}</div>`;
  const F=(a,b)=>`<span class="math-frac"><span>${a}</span><span>${b}</span></span>`;
  const T=(x)=>`<span class="tech-inline">${x}</span>`;
  const P=(d)=>M('1',d,'0','1');
  const Lens=(f)=>M('1','0',F('−1',f),'1');
  const mirror=M('1','0',F('−2','R'),'1');
  const sourceLinks=`<div class="tech-source"><span>推荐原始参考资料：</span><a href="https://www.rp-photonics.com/abcd_matrix.html" target="_blank" rel="noopener noreferrer">RP Photonics · ABCD Matrix</a><a href="https://ocw.mit.edu/courses/6-974-fundamentals-of-photonics-quantum-electronics-spring-2006/pages/lecture-notes/" target="_blank" rel="noopener noreferrer">MIT OCW · Gaussian Beams & Optical Resonators</a></div>`;

  const figRay=`<figure class="tech-figure"><svg viewBox="0 0 820 248" role="img" aria-label="近轴光线在两个参考截面之间的高度与倾角定义"><defs><marker id="tRay032" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#167e5a"/></marker></defs><path d="M45 172H782" stroke="#a2b8ab" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M123 44V206M657 44V206" stroke="#a2b8ab" stroke-width="2" fill="none"/><path d="M123 130L657 68" stroke="#148a68" stroke-width="3.4" marker-end="url(#tRay032)" fill="none"/><path d="M123 172V130 M657 172V68" stroke="#c27749" stroke-width="3"/><path d="M152 130H235" stroke="#77a698" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M209 130A59 59 0 0 0 208 120" stroke="#c27749" stroke-width="2" fill="none"/><path d="M158 211H630M158 205V218 M630 205V218" stroke="#6b9a85" stroke-width="1.6" fill="none"/><g font-size="17" fill="#2b6651"><text x="123" y="29" text-anchor="middle">输入面 S₁</text><text x="657" y="29" text-anchor="middle">输出面 S₂</text><text x="163" y="231" text-anchor="middle">z₁</text><text x="605" y="231" text-anchor="middle">z₂</text><text x="392" y="203" text-anchor="middle">d = z₂ − z₁</text><text x="78" y="122">y₁</text><text x="679" y="89">y₂</text><text x="201" y="108">θ₁</text></g><text x="46" y="190" fill="#698074" font-size="14">参考光轴（y = 0）</text></svg><figcaption>几何定义：两截面相距 d，光线在均匀介质中保持倾角 θ₁，截面高度差为 d·tanθ₁。图中横纵比例并不相同，示意角度不可按图量取。</figcaption></figure>`;

  const figLens=`<figure class="tech-figure"><svg viewBox="0 0 820 234" role="img" aria-label="正薄透镜在高度 y处改变入射光线倾角"><defs><marker id="tLens032" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#147b59"/></marker></defs><path d="M45 165H783" stroke="#b0c2b7" stroke-width="2" stroke-dasharray="7 6"/><path d="M345 27Q363 116 345 211Q327 116 345 27" fill="#d7efe3" stroke="#548b73" stroke-width="2"/><path d="M85 90H345 L670 165" fill="none" stroke="#147b59" stroke-width="3.3" marker-end="url(#tLens032)"/><path d="M345 165V90" stroke="#bf855c" stroke-width="2.4"/><circle cx="670" cy="165" r="4" fill="#b97249"/><path d="M345 193H670 M345 189V198 M670 189V198" stroke="#6a9b83" stroke-width="1.8"/><g font-size="16" fill="#275f4c"><text x="230" y="68">θ⁻ = 0</text><text x="486" y="106">θ⁺ ≈ −y/f</text><text x="368" y="105">y</text><text x="509" y="213">焦距 f</text><text x="677" y="154">焦点</text><text x="356" y="23">理想正薄透镜</text></g></svg><figcaption>推导透镜矩阵只需要两个条件：薄透镜前后横向高度连续；平行入射、离轴高度 y 的光线在透镜后指向后焦点，因此产生近轴角度变化 θ⁺ ≈ −y/f。对任意入射倾角再做线性叠加，就得到 θ⁺ = θ⁻ − y/f。</figcaption></figure>`;

  const figChain=`<figure class="tech-figure"><svg viewBox="0 0 820 236" role="img" aria-label="传播一百毫米、经过二百毫米焦距透镜、再传播一百毫米的定量光线示意"><path d="M45 171H780" stroke="#a8bdaf" stroke-width="2" stroke-dasharray="7 6"/><path d="M110 52V192 M405 44V192 M700 52V192" stroke="#b7cbbd" stroke-width="1.8" stroke-dasharray="5 5"/><path d="M405 47Q420 119 405 191Q390 119 405 47" fill="#d8efe2" stroke="#388463" stroke-width="2"/><path d="M110 90H405L700 130" fill="none" stroke="#147f5a" stroke-width="4"/><path d="M110 171V90 M405 171V90 M700 171V130" stroke="#ba7d52" stroke-width="2.5"/><path d="M125 212H395 M415 212H692 M125 206V218 M395 206V218 M415 206V218 M692 206V218" stroke="#679780" stroke-width="1.8"/><g font-size="16" fill="#285d47"><text x="110" y="35" text-anchor="middle">S₁</text><text x="405" y="35" text-anchor="middle">F(f)</text><text x="700" y="35" text-anchor="middle">S₂</text><text x="260" y="229" text-anchor="middle">d₁ = 100 mm</text><text x="552" y="229" text-anchor="middle">d₂ = 100 mm</text><text x="63" y="76">1 mm</text><text x="713" y="124">0.5 mm</text><text x="520" y="83">−5 mrad</text><text x="110" y="150">θ₁ = 0</text></g></svg><figcaption>与第 07 节数值例题对应：输入光线高于光轴 1 mm、倾角为 0；经过 d₁=100 mm 的自由传播后高度仍为 1 mm；通过焦距 200 mm 的正薄透镜后方向变为 −5 mrad；再传播 d₂=100 mm，输出高度降至 0.5 mm。图中斜率作了视觉放大。</figcaption></figure>`;

  const r=(window.LASER_PRINCIPLES||[]).find(v=>v.id==='raymatrix');
  if(r){
    const preservedLab = r.sections.find(s=>s.body && s.body.includes('id="matrixLab"'));
    r.sections=[
      {title:'01 · 复习矩阵乘法：由线性方程组得到传输算子',body:`<div class="tech-page"><p>在光学中使用 ABCD 矩阵，首先需要明确其数学角色。它不是一种专门的光学定律，而是将一个具有两个输入变量、两个输出变量的<strong>线性映射</strong>写成紧凑的矩阵形式。设两个输出变量满足 y₂=Ay₁+Bθ₁、θ₂=Cy₁+Dθ₁，那么系数自然组成一个 2×2 方阵。</p>${D([M('A','B','C','D'),V('y₁','θ₁'),'<span>=</span>',V('Ay₁ + Bθ₁','Cy₁ + Dθ₁')],'第一行与输入列向量相乘得到输出高度；第二行得到输出倾角。这里不是把四个元素相加，而是每行与每列求内积。')}<p>用一组普通数字先核对乘法：取下面的系数矩阵与输入列向量。</p>${D([M('2','1','2','4'),V('3','2'),'<span>=</span>',V('8','14')],'第一行 2×3+1×2=8；第二行 2×3+4×2=14。')}<p>同样的方法用于光线传播时，数字系数被光学系统的几何参数取代。尤其要注意：矩阵乘法通常不可交换。先通过透镜再传播，与先传播再通过透镜，除特殊参数外不会给出相同结果。</p><div class="tech-assumption"><b>此处需要建立的数学约定</b><p>全文将光线状态写成<strong>列向量</strong>，采用左乘约定：r₂=M r₁。对连续光学段，第一段 M₁ 写在乘积最右侧，之后依次向左排列。列向量没有转置错误，才可能正确推导复合光路。</p></div></div>`},
      {title:'02 · 近轴光线的状态变量及 ABCD 元素的物理量纲',body:`<div class="tech-page"><p>对轴对称系统或一个指定的子午截面，在任意参考面 S，一条光线由横向高度 y 和相对参考光轴的有符号倾角 θ 确定。高度可正可负；倾角采用弧度。定义：</p>${D(['<span>r(z)</span>','<span>=</span>',V('y(z)','θ(z)')],'对于二维近轴传播，给定 y 和 θ，就足以在后续理想元件间确定该条几何光线的轨迹。')}${figRay}<p>设光线在 S₁ 和 S₂ 的状态分别为 r₁ 和 r₂。近轴一阶光学下：</p>${D([V('y₂','θ₂'),'<span>=</span>',M('A','B','C','D'),V('y₁','θ₁')],'等价的两条标量方程：y₂=Ay₁+Bθ₁；θ₂=Cy₁+Dθ₁。')}<table class="tech-sections-table"><thead><tr><th>元素</th><th>对应的灵敏度</th><th>采用 y[m]、θ[rad] 时的单位</th></tr></thead><tbody><tr><td>A</td><td>∂y₂/∂y₁：初始高度对输出高度的贡献</td><td>1</td></tr><tr><td>B</td><td>∂y₂/∂θ₁：初始倾角对输出高度的贡献</td><td>m</td></tr><tr><td>C</td><td>∂θ₂/∂y₁：初始高度对输出倾角的贡献</td><td>m⁻¹</td></tr><tr><td>D</td><td>∂θ₂/∂θ₁：初始倾角对输出倾角的贡献</td><td>1</td></tr></tbody></table><div class="tech-assumption"><b>近轴近似及符号范围</b><p>要求 |θ|≪1 rad，可用 sinθ≈tanθ≈θ。矩阵处理的是一阶光线传输，并不自动包含球差、彗差、高阶热畸变或非线性频率转换。这里的 y 是<strong>单条光线的有符号位置</strong>，不是高斯光束 1/e² 半径 w；这两个量在后文必须分清。</p></div></div>`},
      {title:'03 · 自由传播矩阵：从几何关系逐项推出四个元素',body:`<div class="tech-page"><p>先考虑同一种均匀介质中的一段长度 d，不含透镜和界面。若一条光线在 S₁ 的高度为 y₁、倾角为 θ₁，则传播到 S₂ 后，高度由几何关系给出：</p><div class="tech-result"><p>${T('y₂ = y₁ + d · tanθ₁')}</p><p>在近轴条件下：${T('y₂ ≈ y₁ + dθ₁')}；均匀介质不改变光线方向，故 ${T('θ₂ = θ₁')}。</p></div>${figRay}<p>为了从方程反求 ABCD 元素，将它们逐项与 y₂=Ay₁+Bθ₁、θ₂=Cy₁+Dθ₁ 比较：</p><ol class="tech-steps"><li>在 y₂ 方程中，y₁ 的系数为 1，因此 A=1。</li><li>θ₁ 前的系数为 d，因此 B=d；B 具有长度量纲。</li><li>θ₂ 与输入高度 y₁ 无关，因此 C=0。</li><li>θ₂ 完全等于 θ₁，因此 D=1。</li></ol>${D(['<span>P(d)</span>','<span>=</span>',P('d')],'自由传播矩阵；单位一致时可直接连乘。')}<p>数值检验：输入 y₁=1 mm、θ₁=2 mrad，传播 d=100 mm 后，输出为 y₂=1 mm+100 mm×0.002=1.2 mm；θ₂=2 mrad。注意不要把 2 mrad 当成数字 2 直接代入。</p></div>`},
      {title:'04 · 薄透镜矩阵：从焦点几何关系推导角度变化',body:`<div class="tech-page"><p>将透镜厚度忽略，仅把它视为某一参考面上的折射元件。近轴薄透镜的假设意味着光线过透镜时高度连续，即 y⁺=y⁻。此处采用会聚透镜 f&gt;0 的约定。</p>${figLens}<p>考虑一条平行入射光线：θ⁻=0、入射高度 y。它经正透镜折射后指向距离 f 的后焦点，因此小角近似下 θ⁺≈−y·(1/f)。对于任意原本就有倾角 θ⁻ 的光线，由一阶光学的线性叠加得到：</p>${D([V('y⁺','θ⁺'),'<span>=</span>',V('y⁻','θ⁻ − y⁻ / f')],'上式显式说明：薄透镜只使方向增加一个与入射高度成比例的偏转量。')}<p>与 ABCD 形式逐项比较，A=1、B=0、C=−1/f、D=1。因此：</p>${D(['<span>F(f)</span>','<span>=</span>',Lens('f')],'负焦距 f&lt;0 表示发散透镜；在此符号约定下 C 自动变为正值。')}<p>这类矩阵在固体激光谐振腔中还常用于<strong>等效热透镜</strong>。但真实 Nd:YVO₄ 的热透镜可能沿两个横向方向不同，并且随泵浦条件变化；将其视为理想薄透镜只是首轮设计近似。</p></div>`},
      {title:'05 · 球面腔镜：为什么是 −2/R 而不是 −1/R？',body:`<div class="tech-page"><p>曲面镜的近轴聚焦能力来自反射定律：入射角等于反射角，反射方向相对局部法线具有两倍的角度变化。对近轴球面镜，位于高度 y 处的法线相对光轴偏转近似 y/R，所以在<strong>反射光路展开后的局部正向传播坐标</strong>中：</p><div class="tech-result"><p>${T('y⁺ = y⁻')}</p><p>${T('θ⁺ = θ⁻ − y⁻'+F('2','R'))}</p></div>${D(['<span>M(R)</span>','<span>=</span>',mirror],'本文约定 R&gt;0 对应会聚凹面腔镜；平面镜为 R→∞，其矩阵趋于单位阵。')}<p>对比薄透镜矩阵可看出：曲面镜的近轴等效焦距 fₘ=R/2，这就是系数中出现 2 的原因。反射改变了真实传播方向，因此必须使用一致的局部参考轴或展开光路；不能在固定全局 z 方向下不加处理地套用这个矩阵。</p><p>若折叠镜以入射角 α 斜入射，球面反射的等效曲率还可能在切向、弧矢方向不同：Rₜ=Rcosα、Rₛ=R/cosα。后续三镜折叠腔设计应分别求两轴的往返矩阵，而不是仅用一套矩阵计算光斑圆度。</p></div>`},
      {title:'06 · 复合光路：矩阵顺序和显式连乘推导',body:`<div class="tech-page"><p>设光线先经过 d₁ 的自由传播，再通过焦距 f 的薄透镜，最后再传播 d₂。状态向量的变化按真实先后顺序为：</p><ol class="tech-steps"><li>r₁′=P(d₁)r₁。</li><li>r₂′=F(f)r₁′=F(f)P(d₁)r₁。</li><li>r_out=P(d₂)r₂′=P(d₂)F(f)P(d₁)r₁。</li></ol>${D(['<span>M<sub>total</sub></span>','<span>=</span>',P('d₂'),Lens('f'),P('d₁')],'列向量从最右侧开始依次受作用；不能将三个矩阵按光线经过的顺序从左到右直接相乘。')}<p>先计算中间两项：</p>${D(['<span>F(f) P(d₁)</span>','<span>=</span>',M('1','d₁',F('−1','f'),`1 − ${F('d₁','f')}`)],'这里下排右侧 D=1−d₁/f，是透镜前自由传播导致的结果。')}<p>再左乘 P(d₂)，最终得到：</p>${D(['<span>M<sub>total</sub></span>','<span>=</span>',M(`1 − ${F('d₂','f')}`,`d₁ + d₂ − ${F('d₁ d₂','f')}`,F('−1','f'),`1 − ${F('d₁','f')}`)],'A=1−d₂/f；B=d₁+d₂−d₁d₂/f；C=−1/f；D=1−d₁/f。')}<p>由此可以直接看出，透镜之前和之后的传播距离分别影响不同矩阵元；将 d₁ 与 d₂ 交换时，通常 A 与 D 也随之互换。</p><div class="tech-assumption"><b>工程核对：矩阵行列式</b><p>自由传播矩阵、薄透镜矩阵以及在同一介质中按上述约定建立的球面镜矩阵，都满足 det(M)=AD−BC=1。因此其乘积也满足 det(M_total)=1。对于不满足这个结果的手工计算，应首先检查矩阵乘法、长度单位和符号约定；跨折射率界面时例外将在后文解释。</p></div></div>`},
      {title:'07 · 完整数值算例：逐段计算与总矩阵交叉验证',body:`<div class="tech-page"><p>取 d₁=d₂=100 mm、f=200 mm，输入光线 y₁=1 mm、θ₁=0 rad。所有距离暂时统一使用 mm，则系数 C 应采用 mm⁻¹。</p>${figChain}${D(['<span>M<sub>total</sub></span>','<span>=</span>',M('0.5','150 mm','−0.005 mm⁻¹','0.5')],'代入 A=1−100/200=0.5；B=100+100−(100×100/200)=150 mm；C=−1/200 mm⁻¹。')}<p>将输入状态代入总矩阵：</p>${D([V('y_out','θ_out'),'<span>=</span>',M('0.5','150 mm','−0.005 mm⁻¹','0.5'),V('1 mm','0 rad'),'<span>=</span>',V('0.5 mm','−5 mrad')],'检验量纲：Bθ 的单位是长度；Cy 的单位是弧度。')}<p>再使用逐段传播法，作为独立验证：</p><ol class="tech-steps"><li>第一段自由传播：y=1 mm+100 mm×0=1 mm，θ=0。</li><li>通过透镜：y=1 mm，θ=0−1/200=−0.005 rad=−5 mrad。</li><li>第二段自由传播：y_out=1 mm+100 mm×(−0.005)=0.5 mm；θ_out=−5 mrad。</li></ol><div class="tech-result"><p><strong>逐段计算与矩阵连乘给出完全一致的结果。</strong> 把这组参数放进下方交互实验，然后改变 d₁、d₂ 或 f，观察 A、B、C、D 与输出状态如何改变。</p></div></div>`},
      {title:'08 · 进入晶体介质：必须分清 θ 和 nθ 两种状态向量',body:`<div class="tech-page"><p>实际 Nd:YVO₄ 谐振腔中不只有空气，还有增益晶体和可能的其他透明光学材料。进入折射率 n 的介质时，如果沿用 r=[y,θ]ᵀ，几何厚度为 d 的均匀介质内部依旧使用 P(d)；但在不同折射率之间的平面界面，近轴斯涅尔定律 n₁θ₁=n₂θ₂ 导致：</p>${D(['<span>I₁₂</span>','<span>=</span>',M('1','0','0',F('n₁','n₂'))],'这是以 [y, θ]ᵀ 为状态变量、且以界面法线为同一参考轴的平面折射界面矩阵。')}<p>另一种常见且在激光腔设计中更方便的约定是使用<strong>约化角</strong> u=nθ，定义 r̃=[y,nθ]ᵀ。此时平面界面的传输矩阵可写成单位阵，而在折射率 n 的均匀介质中传播厚度 d 对应：</p>${D(['<span>P̃(d,n)</span>','<span>=</span>',M('1',F('d','n'),'0','1')],'注意右上元素变成 d/n，是因为状态向量的第二分量已改为 nθ；不能把两种约定混用。')}<table class="tech-sections-table"><thead><tr><th>选择的状态向量</th><th>介质中传播 d</th><th>平面 n₁→n₂ 界面</th></tr></thead><tbody><tr><td>[y, θ]ᵀ</td><td>右上 B=d</td><td>D=n₁/n₂</td></tr><tr><td>[y, nθ]ᵀ</td><td>右上 B=d/n</td><td>单位阵</td></tr></tbody></table><p>如果系统的输入、输出参考面位于同一折射率下，第一种约定的总矩阵通常满足 det(M)=1；若输入、输出介质不同，则 det(M)=n_in/n_out。约化角约定中的理想一阶系统通常保持 det(M)=1。这一点可以作为实际晶体布局建模的验算工具。</p></div>`},
      {title:'09 · 从光线 ABCD 转入高斯光束 q 参数和谐振腔稳定性',body:`<div class="tech-page"><p>前面推导的 r=[y,θ]ᵀ 用于追迹<strong>单条几何光线</strong>，并不能直接给出 TEM₀₀ 光束半径。对于满足近轴标量高斯光束假设的光场，可以引入复光束参数 q，把波前曲率半径 R_w 与光斑半径 w 组合在一起：</p><div class="tech-result"><p>${T('1/q = 1/R_w − i λ₀/(π n w²)')}</p><p>其中 λ₀ 是真空波长、n 是均匀介质折射率、w 是 1/e² 强度半径；R_w 是<strong>光束波前</strong>曲率半径，不要和腔镜曲率半径 R_m 混淆。</p></div><p>当 ABCD 描述同一均匀介质内的近轴光学系统时，q 遵循分式线性变换：</p>${D(['<span>q₂</span>','<span>=</span>',F('Aq₁ + B','Cq₁ + D')],'也称 ABCD law；需要在介质界面保持所选光线坐标与 q 的定义一致。')}<p>对驻波谐振腔，从某个选定截面出发，沿物理光路走过一个完整往返再回到同一截面，其矩阵记为 M_rt。稳定高斯腔模在往返后应复现相同 q：</p>${D(['<span>q</span>','<span>=</span>',F('Aq + B','Cq + D')], '两边交叉相乘，得到 Cq²+(D−A)q−B=0。选取符合物理波束条件的复数根。')}<p>对 det(M_rt)=1 的无损近轴一阶模型，常用非临界稳定性条件为 |(A+D)/2|&lt;1；在稳定区边界附近，热透镜、装调误差和镜片曲率公差会显著影响设计裕量。</p><p><strong>理想平凹腔交叉验证：</strong>取 λ₀=1064 nm、L=120 mm、凹面镜 R_m=300 mm，平面端镜为另一端镜。选平面镜处为往返参考面、按展开反射坐标计算，可得：</p>${D(['<span>M_rt</span>','<span>=</span>',M('0.2','0.144 m','−6.667 m⁻¹','0.2')],'往返追迹 P(L)·M(R_m)·P(L)；tr(M_rt)/2=0.2，所以理想腔位于稳定区内部。')}<p>代入自洽条件可得平面镜处 q≈i·0.147 m，即瑞利长度 z_R≈147 mm。由 z_R=πw₀²/λ₀ 得 w₀≈223 μm。这一步完成了从<strong>机械腔长与曲率</strong>到<strong>高斯腔模尺寸</strong>的转换。</p></div>`},
      {title:'10 · 实际 355 nm 三镜腔中的建模顺序和适用边界',body:`<div class="tech-page"><p>将前面方法迁移到三镜折叠式 355 nm 固体激光器时，可先单独分析 1064 nm 基频谐振腔：M1 → Nd:YVO₄ → AOM → M2 → 非线性晶体区 → M3，再沿返回路径回到初始参考面。这条路径包含透射和反射元件，不等于“几何长度相加”的一段自由传播。</p><ol class="tech-steps"><li>指定 M1 附近一个固定参考面，确定所有光线段长度与折射率，并记录 M1、M2、M3 的曲率及入射角。</li><li>明确 [y,θ] 或 [y,nθ] 约定，在 Nd:YVO₄/空气界面使用相匹配的传输矩阵，不能混搭。</li><li>对泵浦工况建立 Nd:YVO₄ 的等效热透镜范围；对曲面折叠镜分别建立切向和弧矢矩阵。</li><li>沿真实往返顺序相乘，求稳定区、自洽 q 以及增益晶体、AOM、SHG、SFG 所在面的 w(z)。</li><li>再与泵浦模式匹配、AOM 通光孔径和两块 LBO 的转换/损伤约束联合分析。ABCD 仅给出一阶腔模信息，不能单独预测 355 nm 输出功率、脉宽或损伤阈值。</li></ol><div class="tech-assumption"><b>针对实际设计的限制</b><p>矩阵法不自动计算 Nd:YVO₄ 热致像差、AOM 动态损耗、LBO 的相位匹配和空间走离、非线性三波耦合、M²&gt;1 的复杂模式以及机械装调公差的统计分布。它应是腔体与模式设计的第一层模型，而不是整机性能验证的替代品。</p></div>${sourceLinks}<p><a class="text-link" href="#/lesson/solid-03">返回本节设计主线 →</a>　<a class="text-link" href="#/lesson/solid-04">衔接三镜折叠腔 →</a>　<a class="text-link" href="#/formulas/solid">查看公式符号手册 →</a></p></div>`},
      {title:'11 · 自检与推导练习（含详细答案）',body:`<div class="tech-page"><p>下面的练习不依赖软件模拟，建议先写出输入、输出状态，再独立完成矩阵推导。两道题涉及工程中最常见的量纲和顺序错误。</p><details class="tech-check"><summary>练习 A：y₁=1 mm、θ₁=2 mrad，在空气中传播 d=150 mm，输出状态是什么？</summary><p>由 P(d) 可得 y₂=1 mm+150 mm×0.002=1.3 mm；θ₂=2 mrad。若把 θ₁ 当成 2 rad，会得到不可能的 301 mm，这是典型单位错误。</p></details><details class="tech-check"><summary>练习 B：证明 P(d₂)F(f)P(d₁) 的行列式等于 1。</summary><p>由 A=1−d₂/f、B=d₁+d₂−d₁d₂/f、C=−1/f、D=1−d₁/f，有 AD−BC=(1−d₂/f)(1−d₁/f)+(d₁+d₂−d₁d₂/f)/f=1。</p></details><details class="tech-check"><summary>练习 C：为什么 Nd:YVO₄ 晶体中的 d/n 不能不经解释就代入自由传播矩阵？</summary><p>因为在 r=[y,θ]ᵀ 的角度坐标中，均匀介质传播 B=d；只有改为 r̃=[y,nθ]ᵀ 的约化角坐标后，传播矩阵的 B 才是 d/n，并且平面折射界面矩阵同步改变。混用会破坏真实光线的折射关系与量纲一致性。</p></details><p>将前述数值例题带入网页交互实验，分别改变焦距 f 和传播距离 d₁、d₂，验证你预测的矩阵元变化是否成立。掌握本专题之后，再进入热透镜变化范围下的谐振腔自洽 q 求解。</p></div>`}
    ];
    if(preservedLab){
      r.sections.splice(7,0,{title:'08 · 交互实验：从输入光线到输出光线',body:preservedLab.body});
      r.sections.forEach((section,i)=>{section.title=section.title.replace(/^\d+\s*·/,String(i+1).padStart(2,'0')+' ·');});
    }
    r.subtitle='几何光线传输的严格推导、矩阵连乘、介质坐标、q 参数与固体激光腔工程应用';
  }

  const solid=(window.LASER_COURSES||[]).find(c=>c.id==='solid');
  const course=solid?.lessons?.find(l=>l.id==='solid-03');
  if(course){
    // Do not rewrite the course overview or adjacent lessons; this one section is the gateway to the full technical chapter.
    const s=course.sections.find(k=>/光线传播矩阵|传播矩阵原理/.test(k.title));
    if(s){
      s.title='ABCD 传播矩阵：从基础推导到实际光路计算';
      s.body=`<p>要将 1064 nm 谐振腔中的元件位置变成可计算的设计参数，必须先掌握近轴传输矩阵。对于输入状态 <span class="formula-inline">[y₁,θ₁]ᵀ</span>，定义输出状态 <span class="formula-inline">[y₂,θ₂]ᵀ</span>，两者具有线性关系：</p>${D([V('y₂','θ₂'),'<span>=</span>',M('A','B','C','D'),V('y₁','θ₁')],'其中 A、D 无量纲；B 的单位为长度，C 的单位为长度的倒数。')}<p>这里不是先记忆四个元素，而是由自由传播的 y₂=y₁+dθ₁、θ₂=θ₁，以及薄透镜的 y₂=y₁、θ₂=θ₁−y₁/f，逐项对照得到对应的矩阵。将元件按真实顺序连乘后，才能进一步讨论腔镜曲率、热透镜以及晶体中的光束传播。</p>${D(['<span>P(d)</span>','<span>=</span>',P('d'),'<span>　</span>','<span>F(f)</span>','<span>=</span>',Lens('f')],'左侧是均匀介质中的自由传播；右侧是焦距 f 的理想薄透镜。')}<p><a class="text-link" href="#/principle/raymatrix">进入专题原理：完整推导、物理假设、三镜腔实例与习题 →</a>。详细专题保留图解和交互计算器，并补充两种折射率坐标约定的差别。</p>`;
    }
  }

  // Symbol handbooks continue to use the original interactive symbol definitions.
  const terms=window.LASER_TERMS||[];
  if(!terms.some(t=>t.id==='reduced-angle'))terms.push({id:'reduced-angle',course:'solid',name:'约化角 nθ',short:'一阶光学中将光线倾角乘以折射率作为状态变量，常记 u=nθ。',detail:'采用 [y,nθ]ᵀ 时，在均匀折射率为 n 的晶体内传播几何厚度 d，其传播矩阵右上元素为 d/n，而不再是 d。',application:'用于 Nd:YVO₄ 等晶体及界面较多的折叠谐振腔建模；不能与 [y,θ]ᵀ 的矩阵约定混用。',aliases:['约化角'],principle:'raymatrix'});
})();
</script>
  <script>
(() => {
  'use strict';
  const COURSES = window.LASER_COURSES || [];
  const REFERENCES = window.LASER_REFERENCES || [];
  const STAGES = window.LASER_DESIGN_STAGES || {};
  const TERMS = window.LASER_TERMS || [];
  const FORMULAS = window.LASER_FORMULAS || [];
  const PRINCIPLES = window.LASER_PRINCIPLES || [];
  let formulaMemory = false;
  let formulaQuery = '';
  let formulaStage = 'all';
  let activeModal = null;
  let lastFocus = null;
  const STORAGE_KEY = 'laser-atlas-v0.1';
  const page = document.getElementById('page');
  const sideCourses = document.getElementById('sideCourses');
  const crumbs = document.getElementById('breadcrumbs');
  const backdrop = document.getElementById('sidebarBackdrop');
  const sidebar = document.getElementById('sidebar');
  const toastEl = document.getElementById('toast');
  const ALL = COURSES.flatMap(c => c.lessons.map(l => ({...l, course:c})));
  let current = null;
  let toastTimer = 0;
  let selectedFold = 'M2';
  let appData = loadData();

  function loadData() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {};
      return {completed: parsed.completed || {}, notes: parsed.notes || {}, answers: parsed.answers || {}, lastLesson: parsed.lastLesson || null};
    } catch (_) { return {completed:{},notes:{},answers:{},lastLesson:null}; }
  }
  function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch (_) { toast('浏览器禁止本地存储，进度暂时无法保存'); } }
  function html(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function getCourse(id) { return COURSES.find(c => c.id === id); }
  function getLesson(id) { return ALL.find(l => l.id === id); }
  function countDone(course) { return course.lessons.filter(l => !!appData.completed[l.id]).length; }
  function totalDone() { return ALL.filter(l => !!appData.completed[l.id]).length; }
  function coursePercent(c) { return Math.round(100*countDone(c)/c.lessons.length); }
  function toast(message) { toastEl.textContent = message; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(() => toastEl.classList.remove('show'),3300); }
  function closeSidebar() { sidebar.classList.remove('is-open'); backdrop.classList.remove('is-open'); }
  function resetTeaching() { document.body.classList.remove('is-teaching'); }
  function titleBar(parts) { crumbs.innerHTML = '<a href="#/home">Laser Atlas</a>' + parts.map((p,i) => `<span class="breadcrumb-slash">/</span>${i===parts.length-1 ? '<strong>'+html(p.name)+'</strong>':'<a href="'+p.link+'">'+html(p.name)+'</a>'}`).join(''); }
  function navFor(route) {
    document.querySelectorAll('.side-link').forEach(a => a.classList.remove('active'));
    let key='home';
    if(route.startsWith('/path')) key='path';
    else if(route.startsWith('/course/')) key='course-'+route.split('/')[2];
    else if(route.startsWith('/lesson/')) {const l=getLesson(route.split('/')[2]); key = l ? 'course-'+l.course.id : 'home';}
    else if(route.startsWith('/tools')) key='tools';
    else if(route.startsWith('/notes')) key='notes';
    else if(route.startsWith('/references')) key='references';
    else if(route.startsWith('/formulas')) key='formulas';
    else if(route.startsWith('/principle')) key='principles';
    const active = document.querySelector(`[data-nav="${key}"]`);
    if(active) active.classList.add('active');
    document.querySelectorAll('.mobile-bottom a').forEach(a=>{const href=a.getAttribute('href');a.classList.toggle('active',(key==='home'&&href==='#/home')||(key.startsWith('course-')&&href==='#/course/solid')||(key==='path'&&href==='#/course/solid')||(key==='formulas'&&href==='#/formulas/solid')||(key==='notes'&&href==='#/notes'));});
  }
  function renderSideCourses() {
    sideCourses.innerHTML = COURSES.map(c => `<a class="side-link" data-nav="course-${c.id}" href="#/course/${c.id}"><span class="course-mini" style="background:${c.accent}24;color:${c.accent}">${html(c.icon)}</span><span>${html(c.label)}</span></a>`).join('');
  }
  function scrollTop() { if(!window.location.hash.includes('lesson') || !location.hash.endsWith(current?.id || '--')) window.scrollTo({top:0,behavior:'instant'}); else window.scrollTo(0,0); }
  function route() {
    const raw = decodeURIComponent((window.location.hash || '#/home').slice(1));
    const bits = raw.split('/').filter(Boolean);
    const main = bits[0] || 'home';
    const old = current?.id;
    current=null;
    closeModal();resetTeaching(); closeSidebar(); navFor('/'+bits.join('/'));
    if(main==='home'){ titleBar([{name:'学习首页'}]); renderHome(); }
    else if(main==='course' && bits[1] && getCourse(bits[1])){ const c=getCourse(bits[1]); titleBar([{name:c.label}]); renderCourse(c); }
    else if(main==='lesson' && bits[1] && getLesson(bits[1])){
      const l=getLesson(bits[1]),c=l.course; current=l;
      titleBar([{name:c.label,link:'#/course/'+c.id},{name:l.title}]); renderLesson(l);
      if(old!==l.id){appData.lastLesson=l.id; saveData();}
    }
    else if(main==='path'){titleBar([{name:'355 nm 专题路线'}]);renderPath();}
    else if(main==='tools'){titleBar([{name:'交互计算实验室'}]);renderTools(bits[1]||'cavity');}
    else if(main==='formulas'){const c=getCourse(bits[1]) || getCourse('solid');titleBar([{name:c.label,link:'#/course/'+c.id},{name:'公式符号手册'}]);renderFormulas(c);}
    else if(main==='principles'){const c=getCourse(bits[1]) || getCourse('solid');titleBar([{name:c.label,link:'#/course/'+c.id},{name:'原理资料馆'}]);renderPrinciples(c);}
    else if(main==='principle'&&bits[1]&&PRINCIPLES.find(p=>p.id===bits[1])){const p=PRINCIPLES.find(p=>p.id===bits[1]);const c=getCourse(p.course);titleBar([{name:c.label,link:'#/course/'+c.id},{name:'原理资料馆',link:'#/principles/'+c.id},{name:p.title}]);renderPrinciple(p);}
    else if(main==='notes'){titleBar([{name:'学习笔记'}]);renderNotes();}
    else if(main==='references'){titleBar([{name:'资料与参考'}]);renderReferences();}
    else if(main==='search'){titleBar([{name:'搜索课程'}]);renderSearch();}
    else {titleBar([{name:'学习首页'}]);renderHome();}
    window.scrollTo({top:0,left:0,behavior:'instant'});
  }
  function heroDrawing() {
    return `<svg viewBox="0 0 520 290" aria-hidden="true">
    <defs><linearGradient id="glow" x1="0" x2="1"><stop stop-color="#63dbb2" stop-opacity=".05"/><stop offset="1" stop-color="#b9f1d3" stop-opacity=".45"/></linearGradient><marker id="arrh" markerWidth="7" markerHeight="7" refX="4" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#79d7b1" stroke-width="1"/></marker></defs>
    <circle cx="340" cy="146" r="127" stroke="#9de4b9" stroke-opacity=".16" fill="none"/><circle cx="340" cy="146" r="85" stroke="#9de4b9" stroke-opacity=".18" fill="none"/>

  function svgCavity(L,R,w0,zR) {

    let pts=[];for(let z=0;z<=L;z+=L/90)pts.push([z,w0*Math.sqrt(1+Math.pow(z/zR,2))]);
    const ymax=Math.max(...pts.map(p=>p[1]))*1.2,yScale=v=>pad.t+plotH-(v/ymax)*plotH,xScale=v=>pad.l+(v/L)*plotW;
    const line=pts.map(([z,v])=>`${xScale(z).toFixed(1)},${yScale(v).toFixed(1)}`).join(' ');
    const ticks=[0,0.25,0.5,0.75,1].map(fr=>{let y=pad.t+plotH*(1-fr);return `<line x1="${pad.l}" y1="${y}" x2="${X-pad.r}" y2="${y}" stroke="#e9f0eb"/><text x="${pad.l-9}" y="${y+4}" text-anchor="end" fill="#92a69b" font-size="11">${(ymax*fr).toFixed(0)}</text>`}).join('');
    return `<svg viewBox="0 0 ${X} ${Y}" role="img" aria-label="理想平凹腔的高斯光斑半径随传播距离变化"><text x="${pad.l}" y="12" fill="#699180" font-size="11">光斑半径 w(z) / μm</text>${ticks}<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+plotH}" stroke="#c1d4c7"/><line x1="${pad.l}" y1="${pad.t+plotH}" x2="${X-pad.r}" y2="${pad.t+plotH}" stroke="#c1d4c7"/><polyline points="${line}" fill="none" stroke="#17a575" stroke-width="3" stroke-linejoin="round"/><circle cx="${xScale(0)}" cy="${yScale(w0)}" r="5" fill="#fff" stroke="#159b6b" stroke-width="2"/><circle cx="${xScale(L)}" cy="${yScale(pts[pts.length-1][1])}" r="5" fill="#fff" stroke="#159b6b" stroke-width="2"/><text x="${pad.l}" y="${Y-7}" fill="#829e8d" font-size="11">平面镜 · 0</text><text x="${X-pad.r}" y="${Y-7}" fill="#829e8d" font-size="11" text-anchor="end">凹面镜 · ${L} mm</text></svg>`;
