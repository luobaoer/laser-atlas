.formula-card{background:#fff;border:1px solid #e1ebe3;border-radius:15px;padding:24px 27px;margin-bottom:15px}.formula-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#358566;font-size:10px;font-weight:800}.formula-index{color:#a2b3a8;font-size:9px;font-weight:700;letter-spacing:1px}.formula-card h3{font-size:17px;color:#224736;margin:7px 0 12px}.formula-expression{background:#f4f9f5;white-space:nowrap;overflow-x:auto;padding:18px 16px;border-radius:11px;font-size:20px;color:#1f4b3c;font-family:Georgia,'Times New Roman',serif;line-height:2.1;scrollbar-width:thin}.eq-symbol{display:inline-block;border-radius:6px;border-bottom:2px dotted #2eaa7d;cursor:pointer;padding:0 2px;margin:0 1px;color:#136d4a;transition:background .15s}.eq-symbol:hover,.eq-symbol:focus-visible{background:#d7eedf;outline:2px solid #a1d8bb;outline-offset:2px}.eq-symbol sub{font-size:.6em}.formula-label{font-size:11px;color:#8b9e91;font-weight:750;margin:18px 0 10px}.formula-symbols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.symbol-definition{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 11px;text-align:left;align-items:start;padding:11px 12px;border:1px solid #e5eee7;background:#fcfefd;border-radius:9px;cursor:pointer;transition:border-color .15s}.symbol-definition:hover{border-color:#9bceb1}.symbol-name{font-family:Georgia,'Times New Roman',serif;font-size:15px;font-weight:800;color:#217b58;grid-row:span 2;min-width:36px}.symbol-meaning{font-size:11px;color:#3f6050;line-height:1.5}.symbol-unit{font-size:10px;color:#90a297}.formula-assumption{border-top:1px solid #e8eee8;margin-top:15px;padding-top:12px;color:#687e70;font-size:11px;line-height:1.7}.formula-assumption strong{color:#3b7658}.formula-example{background:#f0f7f2;padding:10px 12px;border-radius:8px;font-size:11px;color:#357357;margin:10px 0 0}.memory-mode .symbol-definition .symbol-meaning,.memory-mode .symbol-definition .symbol-unit{filter:blur(6px);opacity:.45}.memory-mode .symbol-definition.revealed .symbol-meaning,.memory-mode .symbol-definition.revealed .symbol-unit{filter:none;opacity:1}.memory-mode .symbol-definition{border-style:dashed}

  <script>
window.LASER_COURSES = [
  {
    id:'solid', label:'固体激光', english:'SOLID-STATE LASERS', icon:'◈', accent:'#d67c47', pale:'#fff2e8', stage:'系统课程',
    summary:'从增益晶体和泵浦出发，建立谐振腔，理解声光调 Q 与 355 nm 腔内三倍频。',
    outcomes:['读懂经典固体激光腔型','能独立估算腔模与脉冲能量','理解腔内 SHG / SFG 的设计顺序'],
    lessons:[
      {id:'solid-01', title:'如何从需求开始设计激光器', subtitle:'先定指标，再决定结构', min:9, level:'基础', icon:'01',
        goals:['区分输出指标和设计变量','理解正向仿真与逆向设计','建立 355 nm 设计任务的检查表'],
        sections:[
          {title:'先把「要什么」和「用什么」分开',body:'<p>设计从目标开始，而不是从晶体型号开始。<strong>输出波长、平均功率、重复频率、脉宽、M²、温度稳定性</strong>是目标；Nd:YVO₄ 的长度、腔镜曲率、AOM 型号、LBO 的切割角则是待选择的设计变量。</p><p>当目标互相制约时，工程师要先判断物理可行性，然后比较腔型与成本，而不是直接寻找一个「标准答案」。</p>'},
          {title:'一条完整的 355 nm 能量链',body:'<div class="flowchips"><span>LD 泵浦</span><b>→</b><span>Nd:YVO₄：1064 nm</span><b>→</b><span>SHG：532 nm</span><b>→</b><span>SFG：355 nm</span></div><p>对 355 nm 紫外激光，常见做法是利用二阶非线性晶体：先把部分 1064 nm 倍频成 532 nm，再让 1064 nm 与 532 nm 和频。腔内方案的特殊之处是：<strong>非线性能量提取会反过来影响基频谐振腔</strong>。</p>'},
          {title:'第一张真实需求卡',body:'<p>我们选用一组工业设计指标贯穿学习：<strong>355±3 nm、50 kHz 下 10.5–12.5 W、脉宽 &lt;18 ns、单脉冲能量 &gt;200 μJ、扩束前 M²&lt;1.2</strong>。低漏光、首脉冲、环境稳定性属于后续必须验证的工程约束。</p><p>例：50 kHz、11.5 W 时，单脉冲能量 <span class="formula-inline">E = P / f = 230 μJ</span>。这只是由输出指标得到的能量，并不能直接反推出所需 LD 功率。</p>'}
        ], misconception:'功率达标不代表腔型优秀；热漂移、损伤裕量、批量装调和实际器件可采购性同样重要。',
        quiz:{q:'设计一台 355 nm 激光器时，哪项首先属于“设计目标”，而不是“选型结果”？',options:['腔镜曲率半径 200 mm','LBO 晶体长度 10 mm','50 kHz 下紫外功率 ≥10.5 W','Nd:YVO₄ 掺杂浓度 0.3%'],a:2,why:'输出性能先定义；镜片、晶体和结构参数应由建模、优化与器件可用性共同决定。'}},
      {id:'solid-02', title:'泵浦、增益晶体与热透镜', subtitle:'为什么不是泵浦越强越好', min:12, level:'基础', icon:'02',
        goals:['建立 808 nm / 880 nm 泵浦选择思路','理解泵浦光斑与腔模重叠','认识热透镜如何改变原本稳定的腔'],
        sections:[
          {title:'从 LD 到增益',body:'<p>对于端面泵浦 Nd:YVO₄，泵浦光必须在晶体内被有效吸收，同时要与 1064 nm 激光模式有合适的空间重叠。泵浦光斑过小可能增加晶体热梯度，过大可能使未被腔模利用的泵浦增多。</p><div class="formula">P<sub>abs</sub> ≈ P<sub>in</sub> [1 − exp(−αL)]</div><p>这是忽略反射、饱和及空间分布效应的简单吸收示意。真实设计还要考虑掺杂、泵浦波长吸收谱和温度。</p>'},
          {title:'808 与 880 nm 怎么比较',body:'<p>808 nm 泵浦的成熟度较高；880 nm 直接泵浦到较高能级能够降低量子亏损相关热负荷，但也可能带来吸收不足或器件选择上的权衡。<strong>不应只凭泵浦波长决定更优方案</strong>，应联合比较吸收长度、实际 LD 规格和热边界条件。</p>'},
          {title:'热透镜到底改了什么',body:'<p>高斯泵浦常导致非均匀温度场；温度相关的折射率、热应力和端面形变共同改变波前。初步设计常用等效薄透镜表示：</p><div class="formula">M<sub>thermal</sub> = [[1, 0], [−1 / f<sub>th</sub>, 1]]</div><p>在腔模计算中，<strong>热透镜与腔长、腔镜曲率需要一起扫描</strong>。光斑与稳定区随着泵浦工况变化，是工业设计需要关注的内容。</p>'}
        ],misconception:'“冷腔稳定”不代表正常泵浦时稳定；热透镜应作为可变参数而不是永远固定的镜片。',
        quiz:{q:'为什么选择 Nd:YVO₄ 泵浦光斑时不能无限缩小直径？',options:['因为光束小一定不能起振','会增大局部热负荷，并影响模式匹配与可靠性','因为光学波长会变长','因为 Q 开关不再需要 RF'],a:1,why:'小光斑可能提高泵浦功率密度，同时增加热梯度和损伤风险，必须做综合优化。'}},
      {id:'solid-03',title:'高斯光束、ABCD 与腔长',subtitle:'第一次亲手算出稳定区和镜面光斑',min:16,level:'核心',icon:'03',interactive:'cavity',
        goals:['掌握 g 参数与稳定性条件','计算平凹腔束腰和两端镜面光斑','理解为什么腔长不是越短越好'],
        sections:[
          {title:'从最经典的平凹腔开始',body:'<p>把一面平面镜与一面凹面镜放在空气中，设腔长 <em>L</em>、凹面镜曲率半径 <em>R</em>、波长 λ=1064 nm。理想近轴条件下：</p><div class="formula">g₁ = 1，g₂ = 1 − L/R；稳定需 0 &lt; g₁g₂ &lt; 1</div><p>当 0&lt;L&lt;R 时，平凹腔位于稳定区内部。等号对应临界边界，通常不作为鲁棒设计目标。</p>'},
          {title:'为什么能算出束腰',body:'<p>理想平凹腔的束腰位于平面镜上。先计算瑞利长度，再求束腰和凹面镜处的光斑：</p><div class="formula">z<sub>R</sub> = √[L(R−L)]<br>w₀ = √(λz<sub>R</sub>/π)<br>w(L) = w₀√[1+(L/z<sub>R</sub>)²]</div><p>如果 L=120 mm、R=300 mm，则束腰半径约 <strong>223 μm</strong>，凹面镜光斑半径约 <strong>288 μm</strong>。这些是理想空腔的 1/e² 强度半径。</p>'},
          {title:'从两镜扩展到折叠腔',body:'<p>实际腔内还有晶体、AOM 和折叠镜。每段传播都可以表示为 ABCD 矩阵，组成一整圈往返矩阵 <span class="formula-inline">[[A,B],[C,D]]</span>。</p><div class="formula">q = (Aq+B)/(Cq+D)</div><p>解出自洽复光束参数 q，再沿真实光路传播，才能得到每块晶体和腔镜位置的光斑。<strong>下一课就把这一思路用于三镜腔。</strong></p>'}
        ],misconception:'这里的 L 是理想空气腔长；含有折射晶体和斜入射曲面镜时，不能直接把几何距离代入这个两镜公式。',
        quiz:{q:'对于 λ=1064 nm、R=300 mm 的理想平凹腔，哪一项一定处于稳定区内部？',options:['L=450 mm','L=300 mm','L=120 mm','L=0 mm'],a:2,why:'平凹腔的 g₁g₂=1−L/R；L=120 mm 时为 0.6，在 0 与 1 之间。'}},
      {id:'solid-04',title:'读懂 355 nm 三镜折叠腔',subtitle:'逐个点击 M1、Nd:YVO₄、AOM、M2、LBO、M3',min:18,level:'核心',icon:'04',interactive:'fold',
        goals:['把真实光路分成两段 1064 nm 腔臂','理解 M2 的折叠、聚焦和分光职责','知道各段距离的设计依据'],
        sections:[
          {title:'先确认谁是真正的腔镜',body:'<p>以经典的<strong>三镜折叠式腔内三倍频</strong>光路作为教学案例：M1 与 M3 是两端镜，M2 负责转折；Nd:YVO₄ 和 AOM 在前一腔臂，SHG/THG 晶体在后一腔臂。1064 nm 在整个折叠路径内往返。</p><p>点击下方光路中的元件，查看它的功能、位置选择理由和需要计算的量。为了突出概念，图中的光线没有按真实角度绘制。</p>'},
          {title:'六段距离不是任意填的',body:'<div class="step-list"><div><b>d₁ · M1 → 增益晶体</b><small>先检查泵浦光斑与腔模重叠，同时考虑热透镜位置。</small></div><div><b>d₂ · 增益晶体 → AOM</b><small>满足孔径、损耗和响应要求；AOM 的光斑影响声学渡越时间。</small></div><div><b>d₃ · AOM → M2</b><small>与其余腔段共同决定往返矩阵和腔内模式。</small></div><div><b>d₄、d₅、d₆ · M2 → THG → SHG → M3</b><small>调节两块 LBO 处的 1064/532 nm 光斑及重叠，兼顾转换和损伤裕量。</small></div></div>'},
          {title:'如何决定 M2 的曲率和入射角',body:'<p>如果 M2 是曲面折叠镜，它的曲率影响后臂的聚焦；斜入射会造成切向/弧矢像散。对球面镜，可用 <span class="formula-inline">R<sub>t</sub>=R·cosθ，R<sub>s</sub>=R/cosθ</span> 进行初步近轴分析（θ 为入射角）。</p><p>真正选型时必须同时核实 M2 在 <strong>1064 / 532 / 355 nm</strong> 的反射与透射，以及 M3 对返回波长的处理。不同论文中的“THG、SHG”排列方式可能不同，不能照图直接假设绿光路径。</p>'}
        ],misconception:'不要仅因 SHG/THG 靠近 M3 就认为“越近越好”；其目标是晶体处适当光强、相位匹配及稳定的横向重叠。',
        quiz:{q:'在三镜折叠腔中，为什么改变 M2 的曲率可能同时影响 1064 nm 模式和 LBO 转换效率？',options:['只会改变外部紫外指示光颜色','改变腔内聚焦和晶体处光斑，从而影响非线性光强','只有 M1 的曲率影响腔模','改变镜面曲率会直接改变 Nd:YVO₄ 化学成分'],a:1,why:'M2 是腔内元件；其聚焦影响往返矩阵、各位置腔模和频率转换晶体内的功率密度。'}},
      {id:'solid-05',title:'AOM 调 Q、漏光与 FPS',subtitle:'把 RF 控制波形和实际脉冲区分开',min:14,level:'核心',icon:'05',interactive:'qgate',
        goals:['明确 RF 连续 ON 与 PWM 释放的区别','理解储能导致的首脉冲偏高','知道 FPS 为什么需要评价多个过渡脉冲'],
        sections:[
          {title:'RF 打开为什么反而不出光',body:'<p>很多声光调 Q 腔内使用零级光振荡。<strong>RF 连续加载</strong>时，AOM 把部分零级光衍射出谐振腔，使腔损耗高，激光可能无法达到阈值。<strong>RF 关闭的释放窗口</strong>让损耗降低，储能得以形成强脉冲。</p><p>这只是常见配置；具体调制逻辑必须根据真实 AOM 光路和 RF 驱动定义确认。</p>'},
          {title:'占空比和释放时间',body:'<p>例如 50 kHz 周期为 20 μs。如果 RF 高损耗占空比为 95%，则低损耗释放时间为 1 μs：</p><div class="formula">T = 1/f；t<sub>release</sub> = T(1−D<sub>RF</sub>)</div><p>注意<strong>1 μs 是释放窗口，不是 1 μs 的光学脉宽</strong>。实际激光脉宽可能是十几纳秒，还取决于储能、腔损耗、往返时间和非线性提取。</p>'},
          {title:'首脉冲为什么容易超高',body:'<p>当泵浦持续开启、RF 持续抑制振荡时，反转粒子数可能积累。恢复调 Q 后首个脉冲可能明显高于稳态。<strong>FPS</strong> 是通过调节早期释放的有效损耗或 RF 时序，避免过大首脉冲。</p><p>不能只看第一个峰值：若抑制过强，多余储能可能推迟到第二或第三个脉冲才释放。因此需要同时观察峰值、单脉冲能量、恢复时间和后续过冲。</p>'},
          {title:'你的关光验收应该如何定义',body:'<p>一个明确的工况例子是：<strong>泵浦 ON / DIO ON / RF 连续 ON / 没有 PWM 释放</strong>。这时要测 355 nm 的实际漏光，并验证目标材料在规定驻留条件下是否出现加工痕迹。</p><p>“连续 RF 高损耗”不等同于安全级关断；系统安全设计仍应有独立的措施。</p>'}
        ],misconception:'RF 占空比、释放窗口、光学脉宽是三个不同量；不能混为一谈。',
        quiz:{q:'在常见零级光振荡的 AOM 调 Q 腔中，泵浦保持 ON、RF 连续 ON 通常表示什么？',options:['一直处于低损耗并连续输出大功率','保持高损耗，抑制激光振荡','停止所有热效应','每 20 μs 自动释放一次'],a:1,why:'连续 RF 产生衍射损耗，通常用于抑制振荡；实际剩余漏光仍需测量。'}},
      {id:'solid-06',title:'LBO 二倍频与 355 nm 和频',subtitle:'为什么需要两块非线性晶体',min:13,level:'核心',icon:'06',
        goals:['区分 SHG 与 SFG 的物理过程','知道 LBO 长度、温度与光斑的设计权衡','理解三波转换会反馈影响 1064 nm 腔'],
        sections:[
          {title:'两步得到 355 nm',body:'<div class="formula">1064 + 1064 → 532 nm（SHG）<br>1064 + 532 → 354.7 nm（SFG）</div><p>第二步通常称为三倍频，但在常见固体紫外激光器中，真正执行的是<strong>级联二阶非线性过程</strong>，并不是简单把同一个晶体当作直接 χ⁽³⁾ 变换器。</p>'},
          {title:'为什么不是晶体越长越好',body:'<p>晶体长度更长通常增加有效相互作用距离，但也可能增加空间走离、相位失配累积、温度敏感性和损耗。最佳长度必须与晶体类型、切割方向、实际光斑和脉冲峰值功率共同确定。</p><p>相位匹配是关键条件：<span class="formula-inline">Δk = k₃ − k₂ − k₁ ≈ 0</span>。切割角或温度变化会使 Δk 偏离零，降低转换效率。</p>'},
          {title:'腔内方案的特殊性',body:'<p>在腔外频率转换中，可以先设计独立的基频激光器。腔内频率转换则消耗腔内 1064 nm 光子，改变增益饱和和脉冲演化。此时不能简单地用固定常数 <span class="formula-inline">P₃₅₅=ηP₁₀₆₄</span> 来解释所有工作点。</p><p>下一步做工程建模时，至少应先计算稳定腔模、Q 开关脉冲和两块 LBO 的耦合转换，再求解反馈。</p>'}
        ],misconception:'355 nm 并非由 532 nm “再倍频”得到；532 nm 与 1064 nm 发生和频才得到约 355 nm。',
        quiz:{q:'常见 1064 nm 固体激光器的 355 nm 产生过程正确的是？',options:['1064 → 532；532 → 266','1064 → 532；1064+532 → 355','1064 → 355 单纯折射','1064 + 1064 → 355'],a:1,why:'通常先 SHG，再由剩余 1064 nm 和生成的 532 nm 执行 SFG。'}},
      {id:'solid-07',title:'设计挑战：从指标反推器件',subtitle:'把知识组合成一份工程设计任务书',min:18,level:'实践',icon:'07',interactive:'pulse',
        goals:['将验收指标拆解成可计算的约束','给出结构初选和待测参数清单','识别模型目前不能可靠预测的指标'],
        sections:[
          {title:'需求 → 设计变量 → 验证方法',body:'<p>目标示例：<strong>355±3 nm；50 kHz、1 μs 释放窗口下 10.5–12.5 W；脉宽 &lt;18 ns；单脉冲能量 &gt;200 μJ；扩束前 M²&lt;1.2</strong>。</p><p>首先反推单脉冲能量，再估算可行的基频能量预算；选择 Nd:YVO₄ / Nd:YAG 候选、腔型、Q 开关与 LBO；最后进行泵浦热透镜和公差扫描。</p>'},
          {title:'先学会诚实标注不确定性',body:'<p>单脉冲能量 <span class="formula-inline">E=P/f</span> 可以直接算；但把 12 W 紫外输出反推成“需要 20 W 泵浦”需要额外假定吸收、转换及其他损耗，不能编造一个效率就当成器件选型依据。</p><p>还要把短期千脉冲稳定性、8 h 漂移、低漏光、FPS 过渡和温度稳定性分别建立实测验证计划。</p>'},
          {title:'完整的初步设计交付物',body:'<div class="step-list"><div><b>01 · 系统规格表</b><small>标明约束、工况、单位和测试判据。</small></div><div><b>02 · 光学布局与 ABCD 计算</b><small>提供每个器件的位置、腔模和热焦距扫描。</small></div><div><b>03 · 器件候选库</b><small>注明真实可购型号、波长/镀膜、孔径、温控和供应商依据。</small></div><div><b>04 · 风险及实验计划</b><small>列出尚未验证的转换效率、损伤裕量及长期稳定性。</small></div></div>'}
        ],misconception:'仿真曲线漂亮不能证明能量转换效率、损伤阈值和量产一致性。需要模型验证 + 独立实测。',
        quiz:{q:'哪一项可以仅由 11.5 W@50 kHz 的输出规格直接计算？',options:['所需 Nd:YVO₄ 掺杂浓度','紫外单脉冲能量约 230 μJ','LBO 的最优切割角','整机 8 小时 RMS 稳定性'],a:1,why:'E=P/f=11.5/50000 J=230 μJ；其余需要独立参数、模型或测试。'}}
    ]
  },
  {id:'fiber',label:'光纤激光',english:'FIBER LASERS',icon:'⌁',accent:'#436ec6',pale:'#eaf1ff',stage:'系统课程',
   summary:'从波导模式、光纤增益到 FBG 与环形腔，延伸到偏振、锁模和 SLM 光场调控。',
   outcomes:['理解光纤结构和 V 数','建立光纤振荡器与环形腔概念','理解偏振及空间模式耦合'],
   lessons:[
    {id:'fiber-01',title:'光纤激光器的结构地图',subtitle:'核心、包层、泵浦、增益与反馈',min:10,level:'基础',icon:'01',
     goals:['区分有源光纤与无源光纤','认识双包层泵浦','区分振荡器与放大器'],
     sections:[
       {title:'激光器为什么可以做在一根光纤里',body:'<p>光纤同时能提供<strong>光波导</strong>与掺杂增益介质。常见高功率掺镱（Yb）光纤激光器采用双包层结构：泵浦光在内包层传播并被纤芯吸收，信号光主要受纤芯约束。</p><p>相对块状激光器，长光纤有较大的散热面积，但高功率下仍有非线性、模态不稳定和热管理问题。</p>'},
       {title:'振荡器和放大器有何不同',body:'<p>振荡器需要反馈，例如两端 FBG 构成谐振腔；放大器则主要放大外部种子光，未必需要振荡反馈。<strong>MOPA</strong> 是先由种子振荡器产生信号，再通过一个或多个放大级提升功率。</p>'},
       {title:'两条经典光谱路线',body:'<p><strong>Yb 光纤</strong>常用于约 1 μm 工业光源；<strong>Er 光纤</strong>常用于约 1.55 μm 光通信和科研。这两个例子分别代表不同增益谱、泵浦策略和器件生态。</p>'}],
     misconception:'“光纤激光器的光一定是单模、一定线偏振”都不成立，必须看具体光纤和系统结构。',
     quiz:{q:'一个典型的光纤激光振荡器与光纤放大器最核心的区别是？',options:['是否使用电','是否具有构成振荡条件的反馈','是否一定 1550 nm','是否使用玻璃材料'],a:1,why:'光纤激光振荡器需要光学反馈；放大器则对输入信号提供增益。'}},
    {id:'fiber-02',title:'V 数、NA 与单模条件',subtitle:'从几何参数判断导模能力',min:14,level:'核心',icon:'02',interactive:'fiber',
     goals:['理解数值孔径 NA 与纤芯半径','计算阶跃折射率光纤 V 数','明白 V<2.405 的适用范围'],
     sections:[
       {title:'光纤不是简单的光线全反射',body:'<p>波动光学决定光纤能支持哪些传播模式。对理想圆形阶跃折射率光纤，归一化频率：</p><div class="formula">V = (2πa/λ) · NA</div><p>其中 <em>a</em> 是纤芯半径、λ 是真空波长、NA 是数值孔径。V 反映纤芯尺寸、波长和折射率差对模式数量的共同影响。</p>'},
       {title:'什么时候是单模',body:'<p>对于理想圆形阶跃折射率光纤，<span class="formula-inline">V&lt;2.405</span> 对应只有 LP₀₁ 基模导引（忽略偏振简并）；高于这个值可能出现更高阶模式。</p><p>这个规则不应直接照搬到光子晶体光纤、非标准折射率剖面或某些特殊大模场光纤。</p>'},
       {title:'调一个参数来做设计判断',body:'<p>试试下方 V 数计算器：固定 NA 和波长，逐渐增大纤芯半径，你会看到单模区向多模区转变。然后把波长从 1550 nm 改为 1064 nm，再观察 V 数变化。</p>'}],
     misconception:'单模只意味着导引的横向模式受限，不代表输出一定是严格线偏振。',
     quiz:{q:'其他条件不变时，光纤纤芯半径增大一倍，V 数如何变化？',options:['减半','不变','增大一倍','增大四倍'],a:2,why:'V 与纤芯半径 a 成正比。'}},
    {id:'fiber-03',title:'光纤激光器为什么不一定线偏振',subtitle:'普通单模、保偏光纤与偏振控制',min:11,level:'核心',icon:'03',
     goals:['区分空间单模与偏振态','理解双折射和保偏轴','理解偏振片与偏振控制器的区别'],
     sections:[
       {title:'单模 ≠ 单偏振',body:'<p>普通单模光纤主要限制横向导模，但通常仍存在两种偏振自由度。弯曲、应力、温度改变会使偏振态变化，因此普通单模光纤输出未必固定为线偏振。</p>'},
       {title:'保偏光纤在做什么',body:'<p>PM 光纤通过较强的设计双折射降低两个主轴之间的耦合。在正确沿主轴耦入且器件连接良好的条件下，它能更稳定地维持输入线偏振方向。</p><p>保偏不等于自动产生某一线偏振；系统的偏振质量仍需要通过 PER 等指标评价。</p>'},
       {title:'实际系统设计检查点',body:'<p>若后续使用偏振敏感器件（例如液晶 SLM、某些非线性晶体），要逐段确认偏振态与偏振相关损耗。不要仅凭“连接的是单模光纤”来推断 SLM 已获得合适偏振。</p>'}],
     misconception:'普通单模光纤可以空间单模，却不是自动保偏。',
     quiz:{q:'选择 PM 光纤后，哪种做法仍然必要？',options:['完全不需要对准偏振轴','正确沿保偏轴耦入并验证 PER','把 NA 设为零','移除所有光隔离器'],a:1,why:'PM 光纤本身不能弥补错误的轴向耦合与连接。'}},
    {id:'fiber-04',title:'1550 nm 环形腔与锁模基础',subtitle:'从增益、损耗到往返条件',min:13,level:'进阶',icon:'04',
     goals:['识别环形腔的关键器件','理解 OC、隔离器、滤波器功能','区分连续振荡与锁模脉冲'],
     sections:[
       {title:'一个典型环形腔长什么样',body:'<div class="flowchips"><span>980 nm 泵浦</span><b>+</b><span>EDF 增益</span><b>→</b><span>隔离器</span><b>→</b><span>滤波 / 偏振 / SLM</span><b>→</b><span>OC 输出耦合</span><b>↺</b></div><p>环形腔用一个闭合路径形成往返反馈。OC 取出部分光作为输出；隔离器规定单向传播；滤波和偏振器件调节腔内选择性损耗。</p>'},
       {title:'为什么损耗会影响能否起振',body:'<p>腔内一圈的净小信号增益必须克服所有损耗。自由空间器件、光纤准直器、SLM 等都会引入附加损耗，可能改变阈值和输出性能。</p><p>仅用 1550 nm ASE 测得的耦合效率，不能直接等同于锁模后激光腔的最终效率；光谱、模式、偏振和腔反馈状态都不同。</p>'},
       {title:'锁模的核心区别',body:'<p>连续振荡强调稳定平均功率；锁模则要求腔纵模间建立相干相位关系，形成周期性短脉冲。实现机理可能包含可饱和吸收、非线性偏振旋转等，不能只凭“环形腔闭合”认为它会锁模。</p>'}],
     misconception:'腔内出现 1550 nm 功率不代表已经实现稳定锁模，还应检查时域脉冲与 RF 频谱等。',
     quiz:{q:'环形光纤腔中的 OC（输出耦合器）主要做什么？',options:['把所有泵浦光转成紫外','提取一定比例的腔内光作输出','保证每束光都线偏振','直接测量 M²'],a:1,why:'OC 将部分腔内能量输出，同时让剩余光继续反馈。'}},
    {id:'fiber-05',title:'SLM 光场整形与光纤耦合',subtitle:'为高阶模式实验建立基础',min:14,level:'进阶',icon:'05',
     goals:['认识相位调制和振幅间接调制','理解光纤模场重叠决定耦合','区分高阶模式形状与相位结构'],
     sections:[
       {title:'SLM 实际上在调什么',body:'<p>反射式相位型液晶 SLM 主要控制光场相位。通过光栅、棋盘格或空间滤波，可以把部分能量分配到指定衍射级，实现间接振幅整形，但会付出效率损失。</p>'},

window.LASER_PRINCIPLES=[

 ['物理起点','<p>泵浦光被晶体吸收以后，为 Nd³⁺ 粒子建立反转。<strong>吸收功率不等于有效激光输出功率</strong>：部分能量以热释放，部分受到自发辐射、腔损耗和模式匹配限制。</p>'],
 ['第一个近似模型','<p>均匀吸收的一阶模型：P<sub>abs</sub> = P<sub>in</sub>[1−exp(−αL)]。这里 α 是泵浦波长吸收系数，L 为吸收路径长度。真实 Nd:YVO₄ 的吸收谱、泵浦线宽、双端泵和温升都会改变计算。</p>'],
 ['怎样用于设计','<p>先依据泵浦可聚焦性得到晶体内泵浦光斑，再计算 1064 nm 腔模的大小。二者需要有合适的横向重叠，同时限制热梯度与高阶模式增益。</p>']
 ],'solid-02'),
 principle('gaussian','solid','高斯光束与束腰','光斑、瑞利长度和波前曲率是一组耦合变量',[
 ['概念','<p>理想 TEM₀₀ 的强度分布 I(r)=I₀exp(−2r²/w²)。因此 w 是强度下降到中心 1/e² 时的半径，千万不要把“4.2 mm 光斑”误认为束腰半径。</p>'],
 ['传播规律','<p>w(z)=w₀√[1+(z/z<sub>R</sub>)²]；z<sub>R</sub>=πnw₀²/λ₀（均匀介质）。光斑半径、发散半角与波长无法独立随意调整。</p>'],
 ['工程使用边界','<p>它适合用于理想基模初算和腔模学习；真实 355 nm 光束含非理想模式和像差时，要使用 M²、二阶矩测量或空间传播模型。</p>']
 ],'solid-03'),
 principle('abcd','solid','ABCD 与自洽腔模','理解镜片距离为什么进入一整圈矩阵',[
 ['矩阵建立','<p>在同一坐标约定下，自由传播 P(d)=[[1,d],[0,1]]；薄透镜 F(f)=[[1,0],[−1/f,1]]；球面镜反射 M(R)=[[1,0],[−2/R,1]]。按实际传播顺序组合矩阵。</p>'],
 ['求解驻波腔','<p>往返矩阵 [[A,B],[C,D]] 的本征高斯参数满足 q=(Aq+B)/(Cq+D)，整理得 Cq²+(D−A)q−B=0。必须选择物理上 Im(q)>0 的解（具体与坐标约定相关）。</p>'],
 ['工程应用','<p>对三镜折叠腔，要把晶体厚度、折射率、热焦距、斜入射镜像散和返回路径分别纳入。<strong>单程几何总长度不能直接替代所有矩阵段。</strong></p>']
 ],'solid-03'),
 principle('stability','solid','谐振腔稳定性','冷腔稳定只是设计起点',[
 ['基础判据','<p>理想两镜谐振腔可用 g₁g₂ 判断，平凹腔内 0&lt;L&lt;R 为稳定区。更一般的无损近轴往返矩阵常用 |(A+D)/2|&lt;1 判定。</p>'],
 ['稳定性和增益是两回事','<p>几何稳定并不保证起振：实际输出还受增益、损耗、非线性转换和光学损伤控制。稳定边界附近也可能对装调和热透镜特别敏感。</p>'],
 ['设计时做什么','<p>在一组泵浦功率与热焦距范围内扫描腔模和稳定裕量，再决定是否采用某个曲率及腔长，而不是只验证名义点。</p>']

 principle('thermal','solid','固体晶体热透镜','从泵浦热源进入双轴谐振腔设计',[

 ['一阶近似','<p>热透镜可用 f<sub>th</sub> 表示：[[1,0],[−1/f<sub>th</sub>,1]]。等效焦距可能沿两个正交轴不同，也可能随泵浦功率、偏振与散热边界变化。</p>'],
 ['设计流程','<p>先计算冷腔，再加入标称热焦距及其变化范围。观察晶体、AOM、LBO 处光斑是否超出预期，并追踪 M²、像散及效率的变化。</p>']
 ],'solid-02'),
 principle('fold','solid','三镜折叠腔中的像散与位置','M2 不仅是折光，还会改变两轴模场',[

 ['斜入射效应','<p>若使用球面镜、入射角为 θ，可用 R<sub>t</sub>=Rcosθ、R<sub>s</sub>=R/cosθ 作为切向与弧矢方向的等效曲率（在相应曲率约定下）。两轴腔模可能不同。</p>'],

 ['漏光模式','<p>验收：泵浦 ON、DIO ON、RF 连续 ON、无 PWM 释放。要计算 AOM 是否能抑制 1064 nm 起振，并另行实测 355 nm 残余漏光。RF 高损耗状态不等于安全级关断。</p>'],
 ['FPS 的工程检验','<p>由连续抑制转为 PWM 时，储能可能产生异常首脉冲。FPS 可调节前几个脉冲的损耗与时序，但需同时检查首脉冲、后续过冲、能量和开光响应。</p>']

 ['相位条件','<p>Δk=k₃−k₂−k₁≈0 时，产生场能够沿晶体长度相干累积。温度、切割角、偏振、色散以及双折射走离都会改变最佳条件。</p>'],
 ['腔内与腔外的根本差别','<p>腔内转换提取 1064 nm 光子，会改变基频储能和调 Q 脉冲，因此转换器不能只是独立的“固定效率盒子”。两块晶体还需考虑前后程光路与绿光反射。</p>']

  <script>
(() => {
  'use strict';
  const COURSES = window.LASER_COURSES || [];
  const REFERENCES = window.LASER_REFERENCES || [];
  const STAGES = window.LASER_DESIGN_STAGES || {};
  const TERMS = window.LASER_TERMS || [];
  const FORMULAS = window.LASER_FORMULAS || [];
  const PRINCIPLES = window.LASER_PRINCIPLES || [];
  let formulaMemory = false;
  let formulaQuery = '';
  let formulaStage = 'all';
  let activeModal = null;
  let lastFocus = null;
  const STORAGE_KEY = 'laser-atlas-v0.1';
  const page = document.getElementById('page');
  const sideCourses = document.getElementById('sideCourses');
  const crumbs = document.getElementById('breadcrumbs');
  const backdrop = document.getElementById('sidebarBackdrop');
  const sidebar = document.getElementById('sidebar');
  const toastEl = document.getElementById('toast');
  const ALL = COURSES.flatMap(c => c.lessons.map(l => ({...l, course:c})));
  let current = null;
  let toastTimer = 0;
  let selectedFold = 'M2';
  let appData = loadData();

  function loadData() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {};
      return {completed: parsed.completed || {}, notes: parsed.notes || {}, answers: parsed.answers || {}, lastLesson: parsed.lastLesson || null};
    } catch (_) { return {completed:{},notes:{},answers:{},lastLesson:null}; }
  }
  function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch (_) { toast('浏览器禁止本地存储，进度暂时无法保存'); } }
  function html(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function getCourse(id) { return COURSES.find(c => c.id === id); }
  function getLesson(id) { return ALL.find(l => l.id === id); }
  function countDone(course) { return course.lessons.filter(l => !!appData.completed[l.id]).length; }
  function totalDone() { return ALL.filter(l => !!appData.completed[l.id]).length; }
  function coursePercent(c) { return Math.round(100*countDone(c)/c.lessons.length); }
  function toast(message) { toastEl.textContent = message; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(() => toastEl.classList.remove('show'),3300); }

  function navFor(route) {
    document.querySelectorAll('.side-link').forEach(a => a.classList.remove('active'));
    let key='home';
    if(route.startsWith('/path')) key='path';
    else if(route.startsWith('/course/')) key='course-'+route.split('/')[2];
    else if(route.startsWith('/lesson/')) {const l=getLesson(route.split('/')[2]); key = l ? 'course-'+l.course.id : 'home';}
    else if(route.startsWith('/tools')) key='tools';
    else if(route.startsWith('/notes')) key='notes';
    else if(route.startsWith('/references')) key='references';
    else if(route.startsWith('/formulas')) key='formulas';
    else if(route.startsWith('/principle')) key='principles';
    const active = document.querySelector(`[data-nav="${key}"]`);
    if(active) active.classList.add('active');
    document.querySelectorAll('.mobile-bottom a').forEach(a=>{const href=a.getAttribute('href');a.classList.toggle('active',(key==='home'&&href==='#/home')||(key.startsWith('course-')&&href==='#/course/solid')||(key==='path'&&href==='#/course/solid')||(key==='formulas'&&href==='#/formulas/solid')||(key==='notes'&&href==='#/notes'));});

  function route() {
    const raw = decodeURIComponent((window.location.hash || '#/home').slice(1));
    const bits = raw.split('/').filter(Boolean);
    const main = bits[0] || 'home';
    const old = current?.id;
    current=null;
    closeModal();resetTeaching(); closeSidebar(); navFor('/'+bits.join('/'));
    if(main==='home'){ titleBar([{name:'学习首页'}]); renderHome(); }
    else if(main==='course' && bits[1] && getCourse(bits[1])){ const c=getCourse(bits[1]); titleBar([{name:c.label}]); renderCourse(c); }
    else if(main==='lesson' && bits[1] && getLesson(bits[1])){
      const l=getLesson(bits[1]),c=l.course; current=l;
      titleBar([{name:c.label,link:'#/course/'+c.id},{name:l.title}]); renderLesson(l);
      if(old!==l.id){appData.lastLesson=l.id; saveData();}
    }
    else if(main==='path'){titleBar([{name:'355 nm 专题路线'}]);renderPath();}
    else if(main==='tools'){titleBar([{name:'交互计算实验室'}]);renderTools(bits[1]||'cavity');}
    else if(main==='formulas'){const c=getCourse(bits[1]) || getCourse('solid');titleBar([{name:c.label,link:'#/course/'+c.id},{name:'公式符号手册'}]);renderFormulas(c);}
    else if(main==='principles'){const c=getCourse(bits[1]) || getCourse('solid');titleBar([{name:c.label,link:'#/course/'+c.id},{name:'原理资料馆'}]);renderPrinciples(c);}
    else if(main==='principle'&&bits[1]&&PRINCIPLES.find(p=>p.id===bits[1])){const p=PRINCIPLES.find(p=>p.id===bits[1]);const c=getCourse(p.course);titleBar([{name:c.label,link:'#/course/'+c.id},{name:'原理资料馆',link:'#/principles/'+c.id},{name:p.title}]);renderPrinciple(p);}
    else if(main==='notes'){titleBar([{name:'学习笔记'}]);renderNotes();}
    else if(main==='references'){titleBar([{name:'资料与参考'}]);renderReferences();}
    else if(main==='search'){titleBar([{name:'搜索课程'}]);renderSearch();}
    else {titleBar([{name:'学习首页'}]);renderHome();}
    window.scrollTo({top:0,left:0,behavior:'instant'});
  }

  function svgCavity(L,R,w0,zR) {
    const X=680,Y=220,pad={l:50,r:25,t:18,b:37},plotW=X-pad.l-pad.r,plotH=Y-pad.t-pad.b;
    let pts=[];for(let z=0;z<=L;z+=L/90)pts.push([z,w0*Math.sqrt(1+Math.pow(z/zR,2))]);
    const ymax=Math.max(...pts.map(p=>p[1]))*1.2,yScale=v=>pad.t+plotH-(v/ymax)*plotH,xScale=v=>pad.l+(v/L)*plotW;
    const line=pts.map(([z,v])=>`${xScale(z).toFixed(1)},${yScale(v).toFixed(1)}`).join(' ');
    const ticks=[0,0.25,0.5,0.75,1].map(fr=>{let y=pad.t+plotH*(1-fr);return `<line x1="${pad.l}" y1="${y}" x2="${X-pad.r}" y2="${y}" stroke="#e9f0eb"/><text x="${pad.l-9}" y="${y+4}" text-anchor="end" fill="#92a69b" font-size="11">${(ymax*fr).toFixed(0)}</text>`}).join('');
    return `<svg viewBox="0 0 ${X} ${Y}" role="img" aria-label="理想平凹腔的高斯光斑半径随传播距离变化"><text x="${pad.l}" y="12" fill="#699180" font-size="11">光斑半径 w(z) / μm</text>${ticks}<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+plotH}" stroke="#c1d4c7"/><line x1="${pad.l}" y1="${pad.t+plotH}" x2="${X-pad.r}" y2="${pad.t+plotH}" stroke="#c1d4c7"/><polyline points="${line}" fill="none" stroke="#17a575" stroke-width="3" stroke-linejoin="round"/><circle cx="${xScale(0)}" cy="${yScale(w0)}" r="5" fill="#fff" stroke="#159b6b" stroke-width="2"/><circle cx="${xScale(L)}" cy="${yScale(pts[pts.length-1][1])}" r="5" fill="#fff" stroke="#159b6b" stroke-width="2"/><text x="${pad.l}" y="${Y-7}" fill="#829e8d" font-size="11">平面镜 · 0</text><text x="${X-pad.r}" y="${Y-7}" fill="#829e8d" font-size="11" text-anchor="end">凹面镜 · ${L} mm</text></svg>`;
  }
  function updateCavity() {
    const a=document.getElementById('cavityL'),b=document.getElementById('cavityR');if(!a||!b)return;
    const L=Number(a.value),R=Number(b.value),g=1-L/R;
    document.getElementById('cavityLout').textContent=`${L} mm`;document.getElementById('cavityRout').textContent=`${R} mm`;
    document.getElementById('cavityG').textContent=g.toFixed(3);
    const ok=L>0&&L<R, w=document.getElementById('cavityWaist'), wm=document.getElementById('cavityMirror');
    if(!ok){w.textContent='—';wm.textContent='—';document.getElementById('cavityG').classList.add('invalid');document.getElementById('cavityChart').innerHTML=`<div class="empty-state"><h3>此组平凹腔参数不在稳定区内部</h3><p>L ≥ R；调小腔长或增大曲率半径，再计算稳定高斯模。</p></div>`;document.getElementById('cavityComment').textContent='处于不稳定区或边界外，不应使用理想稳定基模公式继续计算。';return;}
    document.getElementById('cavityG').classList.remove('invalid');

    document.getElementById('cavityChart').innerHTML=svgCavity(L,R,w0,zR);
    document.getElementById('cavityComment').textContent=g<0.08?'腔长接近曲率半径，处于稳定边界附近；需要格外检查热透镜与装调扰动。':'理想空气平凹腔计算；尚未加入增益晶体、热透镜、折叠角和非线性转换。';

  function updateFiber(){

  function updateQ(){

  }
  function updatePulse(){const a=document.getElementById('pulsePower'),b=document.getElementById('pulseFreq');if(!a||!b)return;const p=+a.value,f=+b.value,e=p*1000/f;document.getElementById('pulsePowerOut').textContent=`${p.toFixed(1)} W`;document.getElementById('pulseFreqOut').textContent=`${f} kHz`;document.getElementById('pulseEnergy').textContent=`${e.toFixed(0)} μJ`;document.getElementById('pulseP').textContent=`${p.toFixed(1)} W`;document.getElementById('pulseF').textContent=(f*1000).toLocaleString('en-US');}

  // Only replace text nodes in authored lesson paragraphs. Do not alter formulas,
  // link destinations, HTML attributes, or other interactive controls.
  function enhanceTerms(root,course){if(!document.createTreeWalker||typeof NodeFilter==='undefined')return;
    const glossary=TERMS.filter(t=>t.course===course).flatMap(t=>[t.name,...t.aliases].filter(Boolean).map(alias=>({alias,t}))).sort((a,b)=>b.alias.length-a.alias.length);
    root.querySelectorAll('.lesson-section p,.lesson-section li,.principle-article p').forEach(box=>{
      let replacements=0;
      const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue||!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;const parent=node.parentElement;if(parent?.closest('a,button,code,pre,.formula,.formula-inline,.term-link,.eq-symbol'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
      const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
      nodes.forEach(node=>{if(replacements>=8)return;const v=node.nodeValue;let idx=0;const frag=document.createDocumentFragment();let hits=0;
        while(idx<v.length&&hits<4&&replacements<8){let best=null,pos=v.length;
          for(const item of glossary){let p=v.indexOf(item.alias,idx);if(p<0||p>pos)continue;const alpha=/^[A-Za-z0-9]+$/.test(item.alias);if(alpha&&((p>0&&/[A-Za-z0-9]/.test(v[p-1]))||(p+item.alias.length<v.length&&/[A-Za-z0-9]/.test(v[p+item.alias.length]))))continue;if(p<pos){pos=p;best=item;}}
          if(!best)break;
          frag.appendChild(document.createTextNode(v.slice(idx,pos)));
          const b=document.createElement('button');b.type='button';b.className='term-link';b.dataset.term=best.t.id;b.textContent=best.alias;b.title='点击查看专业名词解释';b.setAttribute('aria-label',best.alias+'：点击查看术语解释');frag.appendChild(b);
          idx=pos+best.alias.length;hits++;replacements++;
        }
        if(hits){frag.appendChild(document.createTextNode(v.slice(idx)));node.parentNode.replaceChild(frag,node);}
      });
    });
  }

      if(a==='print')window.print();if(a==='share')share();if(a==='export-md')exportMD();if(a==='backup')backup();
    }
    const sc=e.target.closest('[data-section-scroll]');if(sc){e.preventDefault();const id=sc.getAttribute('data-section-scroll');document.getElementById(id==='quizBox'?'quizBox':'section-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});}
    const fg=e.target.closest('[data-fold]');if(fg)updateFold(fg.getAttribute('data-fold'));
    const routeBtn=e.target.closest('[data-route]');if(routeBtn){location.hash='#'+routeBtn.getAttribute('data-route');}
    if(e.target.closest('.sidebar a'))closeSidebar();
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='lessonNote'&&current){appData.notes[current.id]=e.target.value;saveData();const s=document.getElementById('noteStatus');if(s)s.textContent='✓ 已自动保存 · 仅本机';}
    if(['cavityL','cavityR'].includes(e.target.id))updateCavity();
    if(['fiberRadius','fiberNA','fiberWL'].includes(e.target.id))updateFiber();
    if(['qFrequency','qDuty'].includes(e.target.id))updateQ();
    if(['pulsePower','pulseFreq'].includes(e.target.id))updatePulse();
    if(e.target.id==='globalSearch')updateSearch();
    if(e.target.id==='formulaSearch'){formulaQuery=e.target.value.trim();renderFormulaResults();}
  });
  document.addEventListener('change',e=>{if(e.target.id==='backupInput')importBackup(e.target.files[0]);if(e.target.id==='formulaStage'){formulaStage=e.target.value;renderFormulaResults();}if(e.target.id==='memoryMode'){formulaMemory=e.target.checked;renderFormulaResults();}});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();closeSidebar();if(document.body.classList.contains('is-teaching'))resetTeaching();}
    if(e.key==='Tab'&&activeModal){const nodes=[...activeModal.querySelectorAll('a[href],button:not([disabled]),[tabindex="0"]')].filter(el=>el.getBoundingClientRect().width>0);if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===activeModal.querySelector('.term-sheet'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.formula-expression [data-sym]')){e.preventDefault();openSymbol(e.target.closest('.formula-expression').dataset.formula,e.target.dataset.sym);}
    if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();location.hash='#/search';setTimeout(()=>document.getElementById('globalSearch')?.focus(),30);}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-fold]')){e.preventDefault();updateFold(e.target.getAttribute('data-fold'));}
  });
  document.getElementById('mobileMenu').addEventListener('click',()=>{sidebar.classList.toggle('is-open');backdrop.classList.toggle('is-open')});
  backdrop.addEventListener('click',closeSidebar);
  document.getElementById('shareBtn').addEventListener('click',share);
  window.addEventListener('hashchange',route);
  renderSideCourses();
  route();
})();

</script>
</body>
</html>
